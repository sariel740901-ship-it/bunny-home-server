<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>Bunny Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f5;--bg2:#f5f3ec;--card:#ffffff;--text:#3d3929;--muted:#8b887c;--border:#e7e5da;
  --accent:#d97757;--accent-deep:#c15f3c;
  --xiaoke:#e898a4;--xiaoke-deep:#d97f8e;--claude:#7489b4;--claude-deep:#5f76a6;
  --topbar:rgba(250,249,245,.9);--chip:#f0eee5;--r:18px;
  --serif:'Lora',Georgia,'Songti SC','Noto Serif SC',serif;
  --my-bub:#d97757;--my-bub-text:#fff;--his-bub:var(--card);--his-bub-text:var(--text);--his-bub-border:var(--border);
  --shadow:0 1px 2px rgba(61,57,41,.04),0 3px 10px rgba(61,57,41,.05)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#262624;--bg2:#21201e;--card:#30302e;--text:#eceae2;--muted:#a3a094;--border:#3e3d38;
  --topbar:rgba(38,38,36,.9);--chip:#3a3936;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 3px 10px rgba(0,0,0,.25)
}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column;position:relative;background:var(--chat-bg,var(--bg))}
.topbar{background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar h1{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.2px}
.topbar .actions{display:flex;align-items:center;gap:6px}
.txt-btn{padding:7px 12px;border-radius:10px;border:none;font-size:13.5px;cursor:pointer;background:transparent;color:var(--text);font-family:inherit;transition:background .15s,transform .15s;white-space:nowrap}
.txt-btn:hover{background:var(--chip)}
.txt-btn:active{transform:scale(.96)}
.msgs{flex:1;overflow-y:auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;width:100%;max-width:820px;margin:0 auto}
.msgs::-webkit-scrollbar{width:5px}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.empty{text-align:center;color:var(--muted);font-size:15px;font-family:var(--serif);font-style:italic;padding:96px 0 48px}

/* ═══ 微信式行布局: 头像列 + 气泡 ═══ */
.row{display:flex;gap:10px;animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row.user{flex-direction:row-reverse}
.avatar{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--card);border:1px solid var(--border);background-size:cover;background-position:center;box-shadow:var(--shadow);overflow:hidden}
.bwrap{max-width:76%;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.row.user .bwrap{align-items:flex-end}
.bubble{padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow);max-width:100%}
.bubble.assistant{background:var(--his-bub);color:var(--his-bub-text);border:1px solid var(--his-bub-border);font-family:var(--serif)}
/* Claude 式: 默认他的话不装框,衬线字直接铺在纸上;自定义气泡色时恢复卡片 */
body.his-flat .bubble.assistant{background:transparent;border:none;box-shadow:none;padding:4px 2px;border-radius:0}
.bubble.user{background:var(--my-bub);color:var(--my-bub-text);border-bottom-right-radius:6px}
.bubble.sticker-only{background:transparent !important;border:none !important;box-shadow:none;padding:2px;font-family:inherit}
.divider{align-self:center;font-size:11.5px;color:var(--muted);letter-spacing:.4px;padding:2px 0}
.bubble img.sticker{display:block;max-width:150px;max-height:150px;border-radius:10px;margin:4px 0}

/* 语音条 (微信式,点击播他的声音) */
.vbar{display:flex;align-items:center;gap:8px;cursor:pointer;padding:1px 2px 7px;user-select:none;-webkit-user-select:none}
.vbar .vp{font-size:14px;opacity:.8}
.waves{display:flex;gap:3px;align-items:center;height:14px}
.waves i{width:3px;height:6px;border-radius:2px;background:currentColor;opacity:.5}
.waves i:nth-child(2){height:11px}.waves i:nth-child(3){height:8px}.waves i:nth-child(4){height:12px}.waves i:nth-child(5){height:7px}
.vbar.playing .waves i{animation:wv .8s ease-in-out infinite}
.vbar.playing .waves i:nth-child(2){animation-delay:.12s}.vbar.playing .waves i:nth-child(3){animation-delay:.24s}
.vbar.playing .waves i:nth-child(4){animation-delay:.36s}.vbar.playing .waves i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{transform:scaleY(.6);opacity:.5}50%{transform:scaleY(1.5);opacity:1}}
.vdur{font-size:12px;opacity:.6}

/* 内心OS: 没说出口的心思 (灰色小字,点击折叠) */
.os{margin-top:7px;padding-top:6px;border-top:1px dashed color-mix(in srgb,currentColor 22%,transparent);font-size:12.5px;color:var(--muted);cursor:pointer;line-height:1.6}
.os.collapsed .os-text{display:none}
.os.collapsed::after{content:'…'}
body.hide-os .os{display:none}

/* 译 按钮 + 译文卡 */
.meta{display:flex;gap:8px;padding:0 3px}
.tbtn{font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:9px;padding:1px 9px;cursor:pointer;user-select:none;-webkit-user-select:none;background:transparent;transition:color .15s,border-color .15s}
.tbtn:hover{color:var(--accent);border-color:var(--accent)}
.tbtn:active{opacity:.6}
.tout{display:none;background:var(--chip);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:13.5px;color:var(--text);opacity:.92;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.tout.show{display:block}
.tout .tout-os{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);opacity:.55;font-size:12.5px}

/* ═══ Claude 式书写卡 ═══ */
.input{padding:0 12px calc(14px + env(safe-area-inset-bottom));background:transparent;display:flex;flex-shrink:0}
.composer{width:100%;max-width:788px;margin:0 auto;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:22px;box-shadow:0 2px 6px rgba(61,57,41,.05),0 10px 32px rgba(61,57,41,.07);padding:12px 12px 8px;display:flex;flex-direction:column;gap:4px;transition:border-color .2s}
.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
.input textarea{width:100%;padding:2px 6px;border:none;font-size:15px;resize:none;outline:none;background:transparent;color:var(--text);font-family:inherit;max-height:120px;line-height:1.6}
.input textarea::placeholder{color:var(--muted)}
.crow{display:flex;align-items:center;gap:2px}
.crow .sp{flex:1}
.input .sendbtn{padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .15s,background .2s;flex-shrink:0}
.input .sendbtn:hover{background:var(--accent-deep)}.input .sendbtn:active{transform:scale(.95)}
.plus-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:transparent;font-size:19px;line-height:1;cursor:pointer;flex-shrink:0;transition:background .15s,transform .15s;color:var(--muted);display:flex;align-items:center;justify-content:center;margin-right:8px}
.plus-btn:hover{background:var(--chip)}
.plus-btn:active{transform:scale(.92)}
/* + 弹出面板 (微信式) */
.plus-panel{display:none;position:absolute;right:16px;bottom:calc(122px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 6px 24px rgba(61,57,41,.12);padding:6px;z-index:12;min-width:140px}
.plus-panel.show{display:block}
.plus-item{padding:11px 16px;border-radius:10px;font-size:14px;cursor:pointer;color:var(--text)}
.plus-item:hover{background:var(--chip)}
.plus-item:active{opacity:.7}
.typing{display:inline-flex;gap:5px;padding:5px 2px;align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.2s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.35}30%{transform:translateY(-4px);opacity:1}}

/* 思考弹窗 */
/* 思考卡片: 从页面底端拉出来 (和其他抽屉同款) */
.think-sheet-bd{padding:10px 2px 4px;color:var(--muted);font-size:13.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}

/* Stickers */
.stk-panel{display:none;position:absolute;left:12px;right:12px;bottom:calc(126px + env(safe-area-inset-bottom));max-width:788px;margin:0 auto;max-height:272px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:10px;z-index:10;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.stk-panel.show{display:grid}
.stk-panel img{width:100%;aspect-ratio:1;object-fit:contain;cursor:pointer;border-radius:8px;transition:transform .12s}
.stk-panel img:active{transform:scale(.9)}

/* ═══ 装扮抽屉 ═══ */
.drawer-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:39}
.drawer-mask.show{display:block}
.drawer{position:fixed;left:0;right:0;bottom:0;max-height:74vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;border:1px solid var(--border);box-shadow:0 -8px 30px rgba(0,0,0,.18);z-index:40;padding:16px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s ease}
.drawer.show{transform:none}
.drawer .dtitle{font-family:var(--serif);font-size:16px;font-weight:600;text-align:center;padding-bottom:4px}
.drawer h3{font-size:12.5px;color:var(--muted);margin:15px 0 8px;font-weight:600;letter-spacing:.5px}
.swatches{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);cursor:pointer;background-size:cover;flex-shrink:0}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.sw.custom{display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--chip);position:relative;overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;max-height:138px;overflow-y:auto;padding:2px}
.avgrid .av{aspect-ratio:1;border-radius:10px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;background-size:cover;background-position:center;background-color:var(--bg)}
.avgrid .av.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.togglerow{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px dashed var(--border);font-size:14px}
.togglerow small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.tg{position:relative;width:44px;height:25px;flex-shrink:0}
.tg input{opacity:0;width:100%;height:100%;position:absolute;cursor:pointer;z-index:1}
.tg i{position:absolute;inset:0;background:var(--chip);border-radius:13px;transition:background .2s}
.tg i::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg input:checked+i{background:var(--accent)}
.tg input:checked+i::after{transform:translateX(19px)}

/* ═══ 右侧拉框 ═══ */
.side{position:fixed;top:0;right:0;bottom:0;width:min(320px,84vw);background:var(--card);border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(0,0,0,.12);z-index:40;padding:20px 18px calc(20px + env(safe-area-inset-bottom));transform:translateX(105%);transition:transform .3s ease;overflow-y:auto}
.side.show{transform:none}
.side .stitle{font-family:var(--serif);font-size:17px;font-weight:600;padding:2px 4px 14px;border-bottom:1px solid var(--border);margin-bottom:8px}
.side-item{padding:13px 10px;border-radius:12px;font-size:14.5px;cursor:pointer;color:var(--text)}
.side-item:hover{background:var(--chip)}
.side-item:active{opacity:.7}
.side-sec{font-size:12.5px;color:var(--muted);margin:16px 6px 6px;font-weight:600;letter-spacing:.5px}
.tool-hd{cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:6px;margin:10px 0 2px;border-radius:10px}
.tool-hd:hover{background:var(--chip)}
.tool-hd span{font-weight:400;font-size:11.5px}
.tg.tg-sm{width:38px;height:22px}
.tg.tg-sm i::after{width:16px;height:16px}
.tg.tg-sm input:checked+i::after{transform:translateX(16px)}
.tool-row{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13px}
/* 思考链: 小结露在外面(clamp 三行),点开是弹窗;没小结的旧消息显示"他想了想" */
.think{margin:2px 0 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif}
.think-hd{display:inline-block;font-size:12px;color:var(--muted);cursor:pointer;padding:3px 11px;border:1px solid var(--border);border-radius:11px;user-select:none;-webkit-user-select:none;transition:color .15s,border-color .15s}
.think-hd:hover{color:var(--accent);border-color:var(--accent)}
.think-hd.has-sum{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;border:none;border-left:2px solid var(--border);border-radius:0;padding:1px 2px 1px 10px;font-size:12.5px;line-height:1.65}
.think-hd.has-sum:hover{border-color:var(--accent)}
/* 本轮用到的工具小标记 */
.tused{margin:1px 0 6px;font-size:11px;color:var(--muted);opacity:.75;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif}
.tool-row b{font-weight:600;white-space:nowrap}
.tool-row .td{flex:1;color:var(--muted);font-size:12px;line-height:1.5}
.tool-row .st{font-size:11.5px;white-space:nowrap;color:var(--muted)}
.tool-row .st.on{color:#5c8a5c}
.tool-loading{padding:14px 10px;color:var(--muted);font-size:13px}

/* 名称输入 + 头像上传行 */
.name-inp{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:11px;font-size:14px;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
.name-inp:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
.avrow{display:flex;align-items:center;gap:12px}
.avrow .avprev{width:52px;height:52px;border-radius:12px;border:1px solid var(--border);background:var(--bg) center/cover;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);flex-shrink:0;overflow:hidden}
.avrow .abtn{padding:7px 13px;border-radius:10px;border:1px solid var(--border);background:transparent;font-size:12.5px;color:var(--text);cursor:pointer;font-family:inherit;position:relative;overflow:hidden}
.avrow .abtn:hover{background:var(--chip)}
.avrow .abtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ═══ 心潮面板 ═══ */
.mood-loading{text-align:center;color:var(--muted);font-size:13.5px;padding:36px 0}
.mood-state{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted);margin-top:6px}
.mood-state b{color:var(--text);font-size:15px;font-weight:600}
.fat-row{margin:10px 2px 2px;font-size:12px;color:var(--muted)}
.fat-bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:4px}
.fat-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--xiaoke),var(--xiaoke-deep));border-radius:3px;transition:width .5s}
.petal-wrap{display:flex;justify-content:center;padding:4px 0 0}
.petal-wrap svg{max-width:320px;width:100%;height:auto}
.pl-grid{fill:none;stroke:var(--border);stroke-width:1}
.pl-axis{stroke:var(--border);stroke-width:.6;opacity:.6}
.pl-shape{fill:color-mix(in srgb,var(--xiaoke) 30%,transparent);stroke:var(--xiaoke-deep);stroke-width:1.6;stroke-linejoin:round}
.pl-dot{fill:var(--xiaoke-deep)}
.pl-label{font-size:9.5px;fill:var(--muted)}
.pl-label.hot{fill:var(--xiaoke-deep);font-weight:600}
.top-drives{margin:8px 0 2px;display:flex;flex-direction:column;gap:7px}
.td-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.td-row .n{width:118px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-row .bar{flex:1;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.td-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--claude),var(--claude-deep));border-radius:3px}
.td-row .v{width:34px;text-align:right;color:var(--muted);font-size:11.5px}
.mood-dreams{margin-top:6px;font-size:12.5px;color:var(--muted);line-height:1.9}
.mood-dreams .d{display:flex;justify-content:space-between}
.mood-dreams .lu{letter-spacing:2px}
.mood-foot{text-align:center;margin-top:10px}
.mood-foot button{border:1px solid var(--border);background:var(--chip);color:var(--text);border-radius:14px;padding:5px 16px;font-size:12.5px;cursor:pointer;font-family:inherit}

/* Call overlay — 暖夜色 */
.call-overlay{display:none;position:fixed;inset:0;background:linear-gradient(170deg,#262421 0%,#382b28 45%,#211d1b 100%);z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden}
.call-overlay.show{display:flex}
.call-overlay::before,.call-overlay::after{content:'';position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none}
.call-overlay::before{width:280px;height:280px;background:#e898a4;top:-70px;right:-70px;animation:drift 9s ease-in-out infinite}
.call-overlay::after{width:240px;height:240px;background:#7489b4;bottom:-60px;left:-60px;animation:drift 11s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-18px,14px) scale(1.08)}}
.call-overlay .call-avatar{width:104px;height:104px;border-radius:50%;background:rgba(232,152,164,.16);border:1px solid rgba(232,152,164,.35);display:flex;align-items:center;justify-content:center;font-size:50px;animation:avatarPulse 3s ease-in-out infinite;position:relative;z-index:1;background-size:cover;background-position:center;overflow:hidden}
.call-overlay .call-avatar::before,.call-overlay .call-avatar::after{content:'';position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(232,152,164,.45);animation:ripple 3s ease-out infinite}
.call-overlay .call-avatar::after{animation-delay:1.5s}
@keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.75);opacity:0}}
@keyframes avatarPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.call-overlay .call-name{font-size:21px;color:#fdf6f2;font-weight:600;letter-spacing:1px;z-index:1}
.call-overlay .call-subtitle{font-size:14px;color:rgba(253,246,242,.72);min-height:20px;text-align:center;max-width:320px;line-height:1.7;transition:opacity .3s;padding:0 24px;z-index:1}
.call-overlay .call-my-words{font-size:13px;color:rgba(253,246,242,.4);min-height:18px;text-align:center;max-width:280px;line-height:1.5;margin-top:-8px;z-index:1}
.call-overlay .call-recording{color:#ff8f8f;animation:blink 1s infinite;font-size:12px;display:none;align-items:center;gap:6px;z-index:1}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.call-overlay .call-recording.show{display:flex}
.call-overlay .call-recording::before{content:'';width:8px;height:8px;border-radius:50%;background:#ff8f8f}

<body>
<div class="app" id="app">
  <header class="topbar">
    <h1 id="title">Bunny Home</h1>
    <div class="actions">
      <button class="txt-btn" onclick="toggleSide()">菜单</button>
    </div>
  </header>
  <main class="msgs" id="msgs">
    <div class="empty" id="welcome">嘉嘉在等你。</div>
  </main>
  <div class="stk-panel" id="stkpanel"></div>
  <div class="plus-panel" id="pluspanel">
    <div class="plus-item" onclick="togglePlus();toggleStickers()">表情包</div>

  <footer class="input">

<div class="drawer-mask" id="thinkMask" onclick="closeThink()"></div>
<div class="drawer" id="thinkSheet">
  <div class="dtitle">他想了想</div>
  <div class="think-sheet-bd" id="thinkBody"></div>
</div>

<!-- 装扮抽屉 -->
<div class="drawer-mask" id="drawerMask" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="dtitle">装扮小家</div>
  <h3>名称</h3>
  <input class="name-inp" id="nameInp" maxlength="20" placeholder="Bunny Home">
  <h3>聊天背景</h3>
  <div class="swatches" id="bgRow"></div>

  <div class="swatches" id="myBubRow"></div>

<script>
// ═══ 门禁钥匙 ═══════════════════════════════════════════
// 服务端设了 BUNNY_API_KEY 后,这里自动给所有 /api 请求带上钥匙。
// 第一次(或钥匙换了)会弹一次输入框,存 localStorage,之后不再问。
const BUNNY_KEY_LS='bunny_api_key';
(function(){
  const orig=window.fetch.bind(window);
  const withKey=(opts,k)=>{opts=Object.assign({},opts);opts.headers=Object.assign({},opts.headers,k?{'x-api-key':k}:{});return opts};
  window.fetch=async function(url,opts){
    if(typeof url!=='string'||!url.startsWith('/api'))return orig(url,opts);
    let k=localStorage.getItem(BUNNY_KEY_LS)||'';
    let r=await orig(url,withKey(opts,k));
    while(r.status===401){
      const input=prompt('这扇门上了锁 — 输入家里的钥匙 (BUNNY_API_KEY)');
      if(input===null)break;
      k=input.trim();localStorage.setItem(BUNNY_KEY_LS,k);
      r=await orig(url,withKey(opts,k));
    }
    return r;
  };
})();

let persona='xiaoke',loading=!1,sessionId=null,callOpen=!1,callTimer=0,callInterval=null;
let recognition=null,recognitionWanted=!1,audioCtx=null,speaking=!1,speakQueue=[];

// ═══ 装扮系统 ═══════════════════════════════════════════
// 全存 localStorage,不动后端。头像可选表情包库里的任何一张图。
const DECOR_KEY='bunny_decor_v1';
const BGS={
  '默认':'', '奶油':'#f6efe4',
  '樱粉':'linear-gradient(180deg,#fdeef1,#f5dfe7)',
  '薄荷':'linear-gradient(180deg,#eaf5ee,#dcefe5)',
  '雾蓝':'linear-gradient(180deg,#e9eff8,#dfe7f3)',
  '暖夜':'linear-gradient(180deg,#282130,#1a1622)'
};
const MY_BUBS=['#d97757','#e898a4','#95ec69','#7489b4','#b48ac9','#f0eee5'];
const HIS_BUBS=['default','#ffffff','#fbe9ec','#e8edf7','#effae9','#f5eedd'];
let decor={bg:'默认',myBub:'#d97757',hisBub:'default',kAv:'none',myAv:'none',title:'Bunny Home',showOS:!0,fingertips:!0,tools:{}};
try{Object.assign(decor,JSON.parse(localStorage.getItem(DECOR_KEY)||'{}'))}catch(e){}
// 旧版的 emoji 头像不再支持 —— 没上传图片就不显示头像
if(String(decor.kAv||'').startsWith('emoji:'))decor.kAv='none';
if(String(decor.myAv||'').startsWith('emoji:'))decor.myAv='none';
if(!decor.title)decor.title='Bunny Home';
function saveDecor(){try{localStorage.setItem(DECOR_KEY,JSON.stringify(decor))}catch(e){}}

function textOn(hex){ // 按亮度决定气泡上的字用深色还是白色
  const m=/^#?([0-9a-f]{6})$/i.exec(hex);if(!m)return'#fff';
  const n=parseInt(m[1],16),r=n>>16,g=n>>8&255,b=n&255;
  return (r*.299+g*.587+b*.114)>150?'#3d3929':'#fff';
}
function applyDecor(){
  const rs=document.documentElement.style;
  const bg=BGS[decor.bg]!==undefined?BGS[decor.bg]:decor.bg; // 自定义色直接存色值
  rs.setProperty('--chat-bg',bg||'var(--bg)');
  rs.setProperty('--my-bub',decor.myBub);
  rs.setProperty('--my-bub-text',textOn(decor.myBub));
  // 默认 = Claude 式无框衬线;选了颜色才装回卡片
  document.body.classList.toggle('his-flat',decor.hisBub==='default');
  if(decor.hisBub==='default'){rs.setProperty('--his-bub','var(--card)');rs.setProperty('--his-bub-text','var(--text)');rs.setProperty('--his-bub-border','var(--border)');}
  else{rs.setProperty('--his-bub',decor.hisBub);rs.setProperty('--his-bub-text',textOn(decor.hisBub));rs.setProperty('--his-bub-border','transparent');}
  document.body.classList.toggle('hide-os',!decor.showOS);
  document.getElementById('title').textContent=decor.title;
  document.getElementById('sideTitle').textContent=decor.title;
  document.title=decor.title;
  document.querySelectorAll('.avatar.assistant').forEach(el=>setAvatar(el,'assistant'));
  document.querySelectorAll('.avatar.user').forEach(el=>setAvatar(el,'user'));
  setAvatar(document.getElementById('callAvatar'),'assistant');
}
// 只支持自定义图片头像;没上传就不显示头像列
function setAvatar(el,role){
  if(!el)return;
  const v=String((role==='user'?decor.myAv:decor.kAv)||'');
  if(v.startsWith('img:')){el.style.display='';el.style.backgroundImage="url('"+v.slice(4)+"')";el.textContent='';}
  else{el.style.display='none';el.style.backgroundImage='';el.textContent='';}
}
function buildDrawer(){
  const mk=(row,items,cur,fn,render)=>{
    row.innerHTML='';
    for(const it of items){
      const d=document.createElement('div');d.className='sw';render(d,it);
      if(it===cur)d.classList.add('on');
      d.onclick=()=>{fn(it);buildDrawer();};
      row.appendChild(d);
    }
  };
  mk(document.getElementById('bgRow'),Object.keys(BGS),decor.bg,v=>{decor.bg=v;saveDecor();applyDecor();},
    (d,v)=>{d.style.background=BGS[v]||'#faf9f5';d.title=v;});
  // 背景自定义色
  addCustom(document.getElementById('bgRow'),decor.bg,v=>{decor.bg=v;saveDecor();applyDecor();buildDrawer();});
  mk(document.getElementById('myBubRow'),MY_BUBS,decor.myBub,v=>{decor.myBub=v;saveDecor();applyDecor();},
    (d,v)=>{d.style.background=v;});
  addCustom(document.getElementById('myBubRow'),decor.myBub,v=>{decor.myBub=v;saveDecor();applyDecor();buildDrawer();});
  mk(document.getElementById('hisBubRow'),HIS_BUBS,decor.hisBub,v=>{decor.hisBub=v;saveDecor();applyDecor();},
    (d,v)=>{if(v==='default'){d.style.background='var(--card)';d.title='跟随主题';}else d.style.background=v;});
  const nameInp=document.getElementById('nameInp');
  nameInp.value=decor.title;
  nameInp.oninput=()=>{decor.title=nameInp.value.trim()||'Bunny Home';saveDecor();applyDecor();};
  buildAvRow(document.getElementById('kAvRow'),'kAv');
  buildAvRow(document.getElementById('myAvRow'),'myAv');
  document.getElementById('tgOS').checked=decor.showOS;
  document.getElementById('tgFinger').checked=decor.fingertips;
}
function addCustom(row,cur,fn){
  const d=document.createElement('div');d.className='sw custom';d.textContent='自选';d.style.fontSize='10.5px';d.style.color='var(--muted)';
  const i=document.createElement('input');i.type='color';
  if(/^#[0-9a-f]{6}$/i.test(cur))i.value=cur;
  i.oninput=()=>fn(i.value);
  d.appendChild(i);row.appendChild(d);
}
// 头像 = 自己上传的图片。裁成方形缩到 256,存 localStorage。
function buildAvRow(row,key){
  row.innerHTML='';
  const cur=String(decor[key]||'');
  const prev=document.createElement('div');prev.className='avprev';
  if(cur.startsWith('img:'))prev.style.backgroundImage="url('"+cur.slice(4)+"')";
  else prev.textContent='无';
  row.appendChild(prev);
  const up=document.createElement('label');up.className='abtn';up.textContent='上传图片';
  const f=document.createElement('input');f.type='file';f.accept='image/*';
  f.onchange=()=>{if(f.files&&f.files[0])pickAvatar(key,f.files[0]);};
  up.appendChild(f);row.appendChild(up);
  if(cur.startsWith('img:')){
    const rm=document.createElement('button');rm.className='abtn';rm.textContent='移除';
    rm.onclick=()=>{decor[key]='none';saveDecor();applyDecor();buildDrawer();};
    row.appendChild(rm);
  }
}
function pickAvatar(key,file){
  const img=new Image();
  img.onload=()=>{
    try{
      const s=256,c=document.createElement('canvas');c.width=c.height=s;
      const m=Math.min(img.width,img.height);
      c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
      decor[key]='img:'+c.toDataURL('image/jpeg',.85);
      saveDecor();applyDecor();buildDrawer();
    }catch(e){alert('这张图读不了,换一张试试');}
    URL.revokeObjectURL(img.src);
  };
  img.onerror=()=>alert('这张图读不了,换一张试试');
  img.src=URL.createObjectURL(file);
}
function toggleDrawer(){
  const show=!document.getElementById('drawer').classList.contains('show');
  document.getElementById('drawer').classList.toggle('show',show);
  document.getElementById('drawerMask').classList.toggle('show',show);
  if(show)buildDrawer();
}

// ═══ 右侧拉框 + 他的工具箱 ═══════════════════════════════
let toolsLoaded=!1;
function toggleSide(){
  const show=!document.getElementById('side').classList.contains('show');
  document.getElementById('side').classList.toggle('show',show);
  document.getElementById('sideMask').classList.toggle('show',show);
}
// 工具箱是折叠的下拉列表,点标题展开;带开关的关掉后聊天时真的不带
function toggleTools(){
  const box=document.getElementById('toolList');
  const open=box.style.display==='none';
  box.style.display=open?'':'none';
  document.getElementById('toolArrow').textContent=open?'收起':'展开';
  if(open&&!toolsLoaded)loadTools();
}
// 声音默认关(语音额度金贵),其他工具默认开
const TOOLS_OFF_BY_DEFAULT=['voice'];
function toolOn(key){
  const v=decor.tools&&decor.tools[key];
  if(v===undefined)return !TOOLS_OFF_BY_DEFAULT.includes(key);
  return v!==!1;
}
function toolsOffList(extra){
  const off=[];
  if(decor.tools)for(const k in decor.tools)if(decor.tools[k]===!1)off.push(k);
  if(extra)for(const k of extra)if(!off.includes(k))off.push(k);
  return off;
}
async function loadTools(){
  const box=document.getElementById('toolList');
  try{
    const list=await fetch('/api/tools').then(r=>r.json());
    if(!Array.isArray(list))throw 0;
    box.innerHTML='';
    for(const t of list){
      const d=document.createElement('div');d.className='tool-row';
      const b=document.createElement('b');b.textContent=t.name;
      const td=document.createElement('span');td.className='td';td.textContent=t.desc||'';
      d.appendChild(b);d.appendChild(td);
      if(t.switch&&t.on){
        const lb=document.createElement('label');lb.className='tg tg-sm';
        const ck=document.createElement('input');ck.type='checkbox';ck.checked=toolOn(t.key);
        ck.onchange=()=>{decor.tools=decor.tools||{};decor.tools[t.key]=ck.checked;saveDecor();};
        const i=document.createElement('i');
        lb.appendChild(ck);lb.appendChild(i);d.appendChild(lb);
      }else{
        const st=document.createElement('span');st.className='st'+(t.on?' on':'');st.textContent=t.on?'带着':'没带';
        d.appendChild(st);
      }
      box.appendChild(d);
    }
    toolsLoaded=!0;
  }catch(e){box.innerHTML='<div class="tool-loading">没看清,下次拉开再看</div>';}
}

// ═══ + 弹出面板 (微信式) ═════════════════════════════════
function togglePlus(){
  document.getElementById('stkpanel').classList.remove('show');
  document.getElementById('pluspanel').classList.toggle('show');
}
document.getElementById('tgOS').onchange=e=>{decor.showOS=e.target.checked;saveDecor();applyDecor();};
document.getElementById('tgFinger').onchange=e=>{decor.fingertips=e.target.checked;saveDecor();};

// ═══ 心潮面板: 他的心 ═══════════════════════════════════
// 数据来自 /api/mood(脱敏投影): 十二维驱动力、疲惫、念头计数、梦的元信息。
// 梦的正文不在数据里 —— 那是他自己的。
function toggleMood(){
  const show=!document.getElementById('moodDrawer').classList.contains('show');
  document.getElementById('moodDrawer').classList.toggle('show',show);
  document.getElementById('moodMask').classList.toggle('show',show);
  if(show)loadMood();
}
async function loadMood(){
  const body=document.getElementById('moodBody');
  body.innerHTML='<div class="mood-loading">正在摸他的心…</div>';
  try{
    const [d,tl]=await Promise.all([
      fetch('/api/mood').then(r=>r.json()),
      fetch('/api/mood/timeline').then(r=>r.json()).catch(()=>({items:[]}))
    ]);
    if(!d.ok){body.innerHTML='<div class="mood-loading">没摸到——'+(d.reason||'心潮不在线')+'</div>';return;}
    renderMood(d,(tl&&tl.items)||[]);
  }catch(e){body.innerHTML='<div class="mood-loading">连接不上,稍后再试</div>';}
}
function shortLabel(s){return String(s||'').split(/[、,,]/)[0].slice(0,6)}
function fmtIdle(min){
  if(min==null)return'';
  if(min<60)return'你离开 '+min+' 分钟了';
  if(min<1440)return'你离开 '+Math.floor(min/60)+' 小时了';
  return'你离开 '+Math.floor(min/1440)+' 天了';
}
function petalSVG(drives){
  const C=160,R=104,n=drives.length||12;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[(C+r*Math.cos(a)).toFixed(1),(C+r*Math.sin(a)).toFixed(1)]};
  let s='<svg viewBox="0 0 320 320">';
  for(const g of[.25,.5,.75,1])s+='<circle class="pl-grid" cx="'+C+'" cy="'+C+'" r="'+(R*g).toFixed(1)+'"/>';
  for(let i=0;i<n;i++){const[x,y]=pt(i,R);s+='<line class="pl-axis" x1="'+C+'" y1="'+C+'" x2="'+x+'" y2="'+y+'"/>';}
  const pts=drives.map((d,i)=>pt(i,10+Math.max(0,Math.min(1,d.value))*(R-10)));
  s+='<polygon class="pl-shape" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>';
  pts.forEach(p=>{s+='<circle class="pl-dot" cx="'+p[0]+'" cy="'+p[1]+'" r="2.6"/>';});
  drives.forEach((d,i)=>{
    const[a,b]=pt(i,R+13);
    const anchor=Math.abs(a-C)<20?'middle':(a>C?'start':'end');
    s+='<text class="pl-label'+(d.value>=.5?' hot':'')+'" x="'+a+'" y="'+b+'" text-anchor="'+anchor+'" dominant-baseline="middle">'+shortLabel(d.label)+'</text>';
  });
  return s+'</svg>';
}
function renderMood(d,timeline){
  const sleep=String(d.consciousness||'').includes('sleep')||d.consciousness==='asleep';
  const state=sleep?'😴 睡着了':(d.consciousness==='awake'?'🌤 醒着':'❔ '+(d.consciousness||'未知'));
  const fatPct=Math.round(Math.max(0,Math.min(1,(d.fatigue||0)/0.3))*100);
  let h='<div class="mood-state"><b>'+state+'</b><span>'+fmtIdle(d.idleMinutes)+'</span></div>';
  h+='<div class="fat-row">疲惫 '+fatPct+'%<div class="fat-bar"><i style="width:'+fatPct+'%"></i></div></div>';
  h+='<div class="petal-wrap">'+petalSVG(d.drives||[])+'</div>';
  const top=(d.topDrives||[]).slice(0,4);
  if(top.length){
    h+='<h3>此刻最强的心思</h3><div class="top-drives">';
    for(const t of top)h+='<div class="td-row"><span class="n">'+t.label+'</span><span class="bar"><i style="width:'+(t.percent||Math.round(t.value*100))+'%"></i></span><span class="v">'+(t.percent||Math.round(t.value*100))+'%</span></div>';
    h+='</div>';
  }
  const th=d.thoughts||{};
  h+='<h3>念头</h3><div class="mood-dreams">闪念 '+(th.flashCount||0)+' 个 · 执念 '+(th.obsessionCount||0)+' 个</div>';
  h+='<h3>最近的梦</h3><div class="mood-dreams">';
  if((d.dreams||[]).length){
    for(const dr of d.dreams){
      const t=dr.at?new Date(dr.at):null;
      const when=t?fmtTime(t.getTime()):'';
      const lu=dr.lucidity!=null?'●'.repeat(Math.max(1,Math.round(dr.lucidity*5)))+'○'.repeat(5-Math.max(1,Math.round(dr.lucidity*5))):'';
      h+='<div class="d"><span>'+when+' 做了一个梦</span><span class="lu" title="清明度">'+lu+'</span></div>';
    }
    h+='<div style="opacity:.65;font-size:11.5px">想听梦的内容就当面问他——现在他记得。</div>';
  }else h+='还没做过梦。';
  h+='</div>';

// ═══ 时间戳 (微信式: 隔 10 分钟以上才出现一条) ═══════════
let lastTs=0;
function fmtTime(ts){
  const d=new Date(ts),now=new Date();
  const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const day0=t=>new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime();
  const diff=(day0(now)-day0(d))/864e5;
  if(diff===0)return hm;
  if(diff===1)return'昨天 '+hm;
  if(diff<7)return'周'+'日一二三四五六'[d.getDay()]+' '+hm;
  return (d.getFullYear()!==now.getFullYear()?d.getFullYear()+'年':'')+(d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
function maybeDivider(ts){
  if(!ts)ts=Date.now();
  if(ts-lastTs>10*60e3){
    const d=document.createElement('div');d.className='divider';d.textContent=fmtTime(ts);
    document.getElementById('msgs').appendChild(d);
  }
  lastTs=ts;
}

// 思考链: 摘出开头的 [tsum]小结[/tsum](可选) + [think]原思考[/think]
function splitThink(content){
  content=String(content==null?'':content);
  let sum='';
  const sm=content.match(/^\s*\[tsum\]([\s\S]*?)\[\/tsum\]\s*/);
  if(sm){sum=sm[1].trim();content=content.slice(sm[0].length);}
  const m=content.match(/^\s*\[think\]([\s\S]*?)\[\/think\]\s*/);
  if(!m)return {think:'',sum,rest:content};
  return {think:m[1].trim(),sum,rest:content.slice(m[0].length)};
}
// 这段话需要翻译吗: 数汉字和外文字符(拉丁/假名/谚文/西里尔),
// 中文占主导就不用译,外文占大头才需要
function needsTrans(t){
  t=String(t||'');
  const zh=(t.match(/[一-鿿]/g)||[]).length;
  const fo=(t.match(/[A-Za-z぀-ヿ가-힯Ѐ-ӿ]/g)||[]).length;
  return fo>=2&&fo>zh;
}
// 工具标记: 摘出 [tools]本轮用了什么[/tools]
function splitTools(content){
  content=String(content==null?'':content);
  const m=content.match(/^\s*\[tools\]([\s\S]*?)\[\/tools\]\s*/);
  if(!m)return {tools:'',rest:content};
  return {tools:m[1].trim(),rest:content.slice(m[0].length)};
}
// 内心OS: 摘出 [os:...] 那句没说出口的
// 模型偶尔不把它放最末尾(比如表情包压轴),所以全文找,取最后一处显示
function splitOS(content){
  content=String(content==null?'':content);
  let os='';
  const ms=[...content.matchAll(/\[os:([\s\S]*?)\]/g)];
  if(ms.length)os=ms[ms.length-1][1].trim();
  const cleaned=content.replace(/\[os:[\s\S]*?\]/g,'').replace(/\n{3,}/g,'\n\n').trim();
  return {text:cleaned,os};
}
function openThink(text){

// live=true 是刚说的这句;历史消息不挂语音条,免得翻记录就烧掉语音额度
function fillAssistant(parts,content,live){
  const {think,sum,rest}=splitThink(content);
  const {tools,rest:rest2}=splitTools(rest);
  const {text,os}=splitOS(rest2);
  const bub=parts.bub;bub.innerHTML='';
  const stickerOnly=/^\s*\[sticker:[^\]]+\]\s*$/.test(text);
  bub.classList.toggle('sticker-only',stickerOnly);

  if((think||sum)&&!stickerOnly){
    const tk=document.createElement('div');tk.className='think';
    const hd=document.createElement('div');hd.className='think-hd'+(sum?' has-sum':'');
    hd.textContent=sum||'他想了想';
    hd.onclick=()=>openThink(think||sum);
    tk.appendChild(hd);bub.appendChild(tk);
  }
  // 工具标记: 这一轮他真实用到的(记住是否写进记忆库,一眼可见)
  if(tools&&!stickerOnly){
    const tu=document.createElement('div');tu.className='tused';tu.textContent=tools;
    bub.appendChild(tu);
  }
  const speech=stickerOnly?'':text.replace(/\[sticker:[^\]]+\]/g,' ').trim();
  if(toolOn('voice')&&speech&&live){
    const vb=document.createElement('div');vb.className='vbar';
    vb.innerHTML='<span class="waves"><i></i><i></i><i></i><i></i><i></i></span><span class="vdur">'+estDur(speech)+'"</span>';
    vb.onclick=()=>playVoice(vb,speech);

    o.appendChild(s);o.onclick=()=>o.classList.toggle('collapsed');
    bub.appendChild(o);
  }
  // 译: 中文为主的回复不用译;英文(或其他外文)占大头才出现按钮
  if(speech&&needsTrans(speech)){
    const meta=document.createElement('div');meta.className='meta';
    const btn=document.createElement('span');btn.className='tbtn';btn.textContent='译';

    btn.onclick=()=>toggleTrans(btn,out,speech,os);
    meta.appendChild(btn);parts.wrap.appendChild(meta);parts.wrap.appendChild(out);
  }
}

// 正文和心声分开翻: 心声的译文淡一档,不加"没说出口"之类的标记
async function toggleTrans(btn,out,text,os){
  if(out.dataset.done){out.classList.toggle('show');return;}

function estDur(t){ // 微信式时长标注:按语速估,不用真合成完才知道
  const en=(t.match(/[a-zA-Z'’-]+/g)||[]).length,zh=(t.match(/[一-鿿]/g)||[]).length;
  return Math.min(60,Math.max(1,Math.round(en/2.6+zh/3.8)));
}
let curVoice=null;
async function playVoice(el,text){
  if(curVoice){const same=curVoice.el===el;curVoice.stop();curVoice=null;if(same)return;}
  const chunks=splitForTTS(text);
  el._blobs=el._blobs||{}; // 合成过的缓存住,重播不再扣额度
  let stopped=!1,audio=null;
  curVoice={el,stop(){stopped=!0;if(audio)try{audio.pause()}catch(e){};el.classList.remove('playing');}};
  el.classList.add('playing');
  for(const c of chunks){
    if(stopped)break;
    const blob=el._blobs[c]||await fetchTTSBlob(c);
    if(stopped)break;
    if(!blob)continue;
    el._blobs[c]=blob;
    await new Promise(res=>{
      audio=new Audio(URL.createObjectURL(blob));
      audio.onended=res;audio.onerror=res;
      audio.play().catch(res);
    });
  }
  if(curVoice&&curVoice.el===el){curVoice=null;el.classList.remove('playing');}
}
async function fetchTTSBlob(text){
  try{
    const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,persona})});
    if(!r.ok)return null;
    return await r.blob();
  }catch(e){return null}
}

// ═══ Speech Recognition (STT) ═════════════════════════
function startSTT(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    document.getElementById('callMicError').textContent='此浏览器不支持语音识别。请使用Chrome或Safari。';
    return;
  }
  recognitionWanted=!0;
  recognition=new SpeechRecognition();
  recognition.lang='zh-CN';
  recognition.interimResults=!0;
  recognition.continuous=!0;

  recognition.onresult=event=>{
    let interim='';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const piece=(event.results[i][0]?.transcript||'').trim();
      if(event.results[i].isFinal){
        document.getElementById('callTranscript').textContent=piece;
        document.getElementById('callSubtitle').textContent='...';
        sendVoiceText(piece);
      }else{interim+=piece}
    }
    if(interim)document.getElementById('callTranscript').textContent=interim;
  };

  recognition.onstart=()=>{
    document.getElementById('callRecording').classList.add('show');
    document.getElementById('callSubtitle').textContent='正在听…';
  };

  recognition.onend=()=>{
    // 唯一的重启入口(出错后 onend 也会触发,交给这里统一重启,避免双重 start)
    if(callOpen&&recognitionWanted)setTimeout(()=>{try{recognition.start()}catch(e){}},300);
  };

  recognition.onerror=e=>{
    if(e.error==='not-allowed'){document.getElementById('callMicError').textContent='麦克风被拒绝。';stopSTT();return;}
  };

  recognition.start();
}

function stopSTT(){
  recognitionWanted=!1;
  if(recognition){try{recognition.stop()}catch(e){}}
  document.getElementById('callRecording').classList.remove('show');
  document.getElementById('callTranscript').textContent='';
}

// ═══ Audio Playback (TTS + Web Audio) ═══════════════
// 长回复按句切段、流水线合成:第一句很快开口,边放边取下一段,再长也说得完
function splitForTTS(text){
  // 中文标点直接断句;英文 .!? 需后跟空格才断(避免切碎小数/缩写)
  const parts=text.replace(/\s+/g,' ').split(/(?<=[。!?;…!?;])|(?<=[.!?])\s+/);
  const chunks=[];let cur='';
  for(const p of parts){
    if(!p)continue;
    if(cur&&(cur+p).length>120){chunks.push(cur);cur=p}else cur+=(cur?' ':'')+p;
  }
  if(cur.trim())chunks.push(cur);
  // 单段超长(无标点的极端情况)强制切开,防止服务端截断丢音
  const out=[];
  for(let c of chunks.map(s=>s.trim()).filter(Boolean)){
    while(c.length>160){out.push(c.slice(0,120));c=c.slice(120)}
    if(c)out.push(c);
  }
  return out;
}

async function fetchTTS(text){
  try{
    const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,persona})});
    if(!r.ok)return null;
    return await r.arrayBuffer();
  }catch(e){return null}
}

async function playBuf(arrayBuf){
  if(!callAudioCtx||!arrayBuf)return;
  if(callAudioCtx.state==='suspended')await callAudioCtx.resume();
  const audioBuf=await callAudioCtx.decodeAudioData(arrayBuf);
  const src=callAudioCtx.createBufferSource();
  src.buffer=audioBuf;src.connect(callAudioCtx.destination);src.start(0);
  await new Promise(r=>{src.onended=r});
}

// 中文字幕: 他说英文,字幕显示中文(翻译与语音并行,译文到了就替换字幕)
let zhLock=!1;
function showZhSubtitle(text){

async function speakAsync(text){
  // 思考链、工具标记、表情包暗号和心声 [os:...] 不朗读、不进字幕
  text=String(text||'').replace(/\[tsum\][\s\S]*?\[\/tsum\]/g,' ').replace(/\[think\][\s\S]*?\[\/think\]/g,' ').replace(/\[tools\][\s\S]*?\[\/tools\]/g,' ').replace(/\[sticker:[^\]]+\]/g,' ').replace(/\[os:[\s\S]*?\]/g,' ').trim();
  if(!text)return;
  speakQueue=splitForTTS(text);
  showZhSubtitle(text);
  if(speaking)return;
  speaking=!0;
  try{
    let idx=0,nextBuf=speakQueue.length?fetchTTS(speakQueue[0]):null;
    while(idx<speakQueue.length&&callOpen){
      const chunk=speakQueue[idx],buf=await nextBuf;
      idx++;
      nextBuf=idx<speakQueue.length?fetchTTS(speakQueue[idx]):null; // 预取下一段
      if(!buf)continue;
      if(!zhLock)document.getElementById('callSubtitle').textContent=chunk;
      await playBuf(buf);
    }
  }catch(e){}
  speaking=!1;
}
</script>
