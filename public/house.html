<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>小屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f5;--bg2:#f5f3ec;--card:#ffffff;--text:#3d3929;--muted:#8b887c;--border:#e7e5da;
  --accent:#d97757;--chip:#f0eee5;
  --dream-bg:linear-gradient(135deg,#f2eef9,#faf6fc);--dream-border:#e5ddf0;--dream-text:#5b5372;
  --serif:'Lora',Georgia,'Songti SC','Noto Serif SC',serif;
  --shadow:0 1px 2px rgba(61,57,41,.04),0 3px 10px rgba(61,57,41,.05);
  --topbar:rgba(250,249,245,.9)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#262624;--bg2:#21201e;--card:#30302e;--text:#eceae2;--muted:#a3a094;--border:#3e3d38;
  --chip:#3a3936;--topbar:rgba(38,38,36,.9);
  --dream-bg:linear-gradient(135deg,#332f42,#2d2a38);--dream-border:#454055;--dream-text:#c9c2dd;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 3px 10px rgba(0,0,0,.25)
}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','MiSans',BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:5;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 16px;text-align:center}
.topbar h1{font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:.4px}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px}
.sec{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:20px}
.sec h2{font-family:var(--serif);font-size:14.5px;font-weight:500;letter-spacing:.4px;margin-bottom:12px;display:flex;align-items:center}
.sec h2 .muted{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:auto;letter-spacing:0}
.kv{font-size:13.5px;line-height:1.9;color:var(--text)}
.kv .lab{color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:4px;overflow:hidden;margin:5px 0 12px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .5s;background:var(--accent)}
.drive{margin-bottom:4px}
.drive .dl{display:flex;justify-content:space-between;font-size:12.5px}
.drive .dl b{font-weight:500}
.drive .dl span{color:var(--muted)}
/* 下拉式: 平常只露状态和疲惫,点开才看具体心情值 */
.foldbtn{width:100%;border:none;background:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;padding:4px 0 0;display:flex;align-items:center;justify-content:center;gap:5px}
.foldbtn .chev{display:inline-block;transition:transform .25s;font-size:10px}
/* 十二维花瓣图(搬自旧的心情面板) */
.petal-wrap{display:flex;justify-content:center;padding:2px 0 6px}
.petal-wrap svg{max-width:300px;width:100%;height:auto}
.pl-grid{fill:none;stroke:var(--border);stroke-width:1}
.pl-axis{stroke:var(--border);stroke-width:.6;opacity:.6}
.pl-shape{fill:color-mix(in srgb,#e898a4 30%,transparent);stroke:#d97f8e;stroke-width:1.6;stroke-linejoin:round}
.pl-dot{fill:#d97f8e}
.pl-label{font-size:9.5px;fill:var(--muted)}
.pl-label.hot{fill:#d97f8e;font-weight:600}
.thoughts{font-size:12.5px;color:var(--muted);padding-top:2px}
.fold{max-height:0;overflow:hidden;transition:max-height .35s ease}
.open .fold{max-height:960px}
.open .foldbtn .chev{transform:rotate(180deg)}
/* 他的梦境 */
.dream{background:var(--dream-bg);border:1px solid var(--dream-border);border-radius:12px;padding:11px 13px;margin-bottom:9px;cursor:pointer}
.dream:last-child{margin-bottom:0}
.dream .dw{font-size:11px;color:var(--muted);letter-spacing:.3px;margin-bottom:3px}
.dream .dg{font-family:var(--serif);font-size:13.5px;line-height:1.8;color:var(--dream-text)}
.dream .df{font-family:var(--serif);font-size:13px;line-height:1.85;color:var(--dream-text);opacity:.92;max-height:0;overflow:hidden;transition:max-height .35s ease;border-top:0 dashed var(--dream-border)}
.dream.open .df{max-height:600px;margin-top:8px;padding-top:8px;border-top-width:1px}
.dream .dhint{font-size:10.5px;color:var(--muted);margin-top:4px}
.dream.open .dhint{display:none}
/* 划拉式: 卡面只占两条的高度,更多的往下滑 */
.dreamscroll{max-height:198px;overflow-y:auto;overscroll-behavior:contain;padding-right:3px}
.dreamscroll::-webkit-scrollbar{width:4px}
.dreamscroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tl{list-style:none}
.tl li{font-size:13px;line-height:1.7;padding:6px 0;border-bottom:1px dashed var(--border);display:flex;gap:10px}
.tl li:last-child{border-bottom:none}
.tl .tt{color:var(--muted);font-size:11.5px;white-space:nowrap;padding-top:2px}
.starcard{display:block;text-decoration:none;color:#e8e4da;background:radial-gradient(120% 160% at 20% 0%,#2b2844 0%,#14131c 70%);border:1px solid #3a3560;border-radius:16px;box-shadow:var(--shadow);padding:18px 16px;margin-bottom:20px;position:relative;overflow:hidden}
.starcard h2{font-family:var(--serif);font-size:15px;font-weight:500;letter-spacing:.4px}
.starcard p{font-size:12px;color:rgba(232,228,218,.65);margin-top:4px}
.starcard .stars{position:absolute;inset:0;pointer-events:none}
.empty{color:var(--muted);font-size:12.5px;font-style:italic;font-family:var(--serif)}
.hide{display:none !important}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:10.5px;letter-spacing:.5px;position:relative}
.tabbar a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--accent)}
.tabbar a .dot{position:absolute;top:-1px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:#e0524d;display:none}
.tabbar a .dot.show{display:block}
</style>
</head>
<body>
<header class="topbar"><h1>他的小屋</h1></header>
<div class="wrap">
  <a class="starcard" href="/starmap.html" id="starcard">
    <canvas class="stars" id="starsMini"></canvas>
    <h2>记忆星图</h2>
    <p id="starHint">你们的每段记忆都是一颗星 — 点进去看夜空</p>
  </a>

  <div class="sec" id="moodSec">
    <h2>他的情绪 <span class="muted" id="moodAt"></span></h2>
    <div id="moodBody" class="kv empty">正在感应…</div>
    <div class="fold"><div id="moodMore" class="kv"></div></div>
    <button class="foldbtn hide" id="moodFold" onclick="document.getElementById('moodSec').classList.toggle('open')">具体的心情 <span class="chev">▼</span></button>
  </div>

  <div class="sec">
    <h2>他的梦境 <span class="muted" id="dreamCount"></span></h2>
    <div id="dreamBody" class="kv empty dreamscroll">还没有新的梦</div>
  </div>

  <div class="sec">
    <h2>他的心事</h2>
    <ul class="tl" id="tlBody"><li><span class="empty">安安静静的</span></li></ul>
  </div>
</div>

<nav class="tabbar">
  <a href="/"><svg viewBox="0 0 24 24"><path d="M21 7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h1v4l5-4h8a2 2 0 0 0 2-2z"/></svg>消息</a>
  <a href="/moments.html"><svg viewBox="0 0 24 24"><path d="M12 21v-8"/><path d="M12 13c0-4 3-6.5 7.5-6.5 0 4.5-3 6.5-7.5 6.5z"/><path d="M12 13c0-3-2.2-5-5.8-5 0 3.4 2.2 5 5.8 5z"/></svg>动态<span class="dot" id="mdot"></span></a>
  <a class="on" href="/house.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V19h12V9.5"/><path d="M10 19v-5h4v5"/></svg>小屋</a>
  <a href="/games.html"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="9" rx="4.5"/><path d="M8 10.8v3.4M6.3 12.5h3.4"/><path d="M15.6 11.3h.01M18 13.6h.01"/></svg>游戏</a>
</nav>

<script>
const BUNNY_KEY_LS='bunny_api_key';
(function(){
  const orig=window.fetch.bind(window);
  const withKey=(opts,k)=>{opts=Object.assign({},opts);opts.headers=Object.assign({},opts.headers,k?{'x-api-key':k}:{});return opts};
  window.fetch=async function(url,opts){
    if(typeof url!=='string'||!url.startsWith('/api'))return orig(url,opts);
    let k=localStorage.getItem(BUNNY_KEY_LS)||'';
    let r=await orig(url,withKey(opts,k));
    while(r.status===401){
      const input=prompt('这扇门上了锁 — 输入家里的钥匙 (BUNNY_API_KEY)');
      if(input===null)break;
      k=input.trim();localStorage.setItem(BUNNY_KEY_LS,k);
      r=await orig(url,withKey(opts,k));
    }
    return r;
  };
})();
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}

// 星图卡片上的小星星
(function(){
  const cv=document.getElementById('starsMini'),ctx=cv.getContext('2d');
  const w=cv.width=340,h=cv.height=90;
  for(let i=0;i<40;i++){
    ctx.beginPath();
    ctx.arc(Math.random()*w,Math.random()*h,Math.random()*1.3+0.3,0,7);
    ctx.fillStyle='rgba(232,228,218,'+(Math.random()*0.7+0.15)+')';
    ctx.fill();
  }
})();

// 他此刻的心: 平常只露状态+疲惫,点开看具体心情值(每条一个浅色)
const CONS={awake:'醒着',sleeping:'睡着了',drowsy:'昏昏欲睡',dreaming:'在做梦'};
// 具体的心情用 英文 · 中文 显示(英文 key 来自心潮,中文是短词)
const DRIVE_ZH={possess:'占有欲',monitor:'惦记',crave:'黏人',share:'分享欲',libido:'渴望',curiosity:'好奇',boredom:'无聊',social:'想热闹',duty:'责任感',reflection:'沉淀',grieve:'难过',anger:'生气'};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'';
function driveLabel(dr){
  if(dr.key)return cap(dr.key)+' · '+(DRIVE_ZH[dr.key]||String(dr.label||dr.name||'').split(/[、,，]/)[0]||dr.key);
  return String(dr.name||dr.label||'');
}
function shortLabel(dr){return dr.key&&DRIVE_ZH[dr.key]?DRIVE_ZH[dr.key]:String(dr.label||dr.name||'').split(/[、,，]/)[0].slice(0,6)}
function petalSVG(drives){
  const C=160,R=104,n=drives.length||12;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[(C+r*Math.cos(a)).toFixed(1),(C+r*Math.sin(a)).toFixed(1)]};
  let s='<svg viewBox="0 0 320 320">';
  for(const g of[.25,.5,.75,1])s+='<circle class="pl-grid" cx="'+C+'" cy="'+C+'" r="'+(R*g).toFixed(1)+'"/>';
  for(let i=0;i<n;i++){const[x,y]=pt(i,R);s+='<line class="pl-axis" x1="'+C+'" y1="'+C+'" x2="'+x+'" y2="'+y+'"/>';}
  const pts=drives.map((d,i)=>pt(i,10+Math.max(0,Math.min(1,d.value))*(R-10)));
  s+='<polygon class="pl-shape" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>';
  pts.forEach(p=>{s+='<circle class="pl-dot" cx="'+p[0]+'" cy="'+p[1]+'" r="2.6"/>';});
  drives.forEach((d,i)=>{
    const[a,b]=pt(i,R+13);
    const anchor=Math.abs(a-C)<20?'middle':(a>C?'start':'end');
    s+='<text class="pl-label'+(d.value>=.5?' hot':'')+'" x="'+a+'" y="'+b+'" text-anchor="'+anchor+'" dominant-baseline="middle">'+shortLabel(d)+'</text>';
  });
  return s+'</svg>';
}
const PASTEL=['#e8b4a0','#a9c6b5','#a9bede','#cdb6dc','#e3cf9e','#dbabb7','#b7c9a8'];
fetch('/api/mood').then(r=>r.json()).then(d=>{
  const el=document.getElementById('moodBody');
  if(!d||!d.ok){el.textContent=(d&&d.reason)||'心潮不在线';return}
  el.classList.remove('empty');
  const fat=Math.round((d.fatigue||0)/0.3*100);
  el.innerHTML='<div><span class="lab">状态: </span>'+(CONS[d.consciousness]||d.consciousness||'—')
    +(d.idleMinutes!=null?'<span class="lab"> · 独处了 </span>'+Math.round(d.idleMinutes)+'<span class="lab"> 分钟</span>':'')+'</div>'
    +'<div class="lab" style="margin-top:6px;font-size:12.5px">疲惫 '+fat+'%</div>'
    +'<div class="bar" style="margin-bottom:2px"><i style="width:'+Math.min(100,fat)+'%;background:#c9b8a8"></i></div>';
  // 全量十二维,按强弱排 —— 上游 topDrives 只给前 4 条,不够看
  const all=(d.drives&&d.drives.length?d.drives:(d.topDrives||[]));
  const bars=[...all].sort((a,b)=>((b.value??b.intensity??0)-(a.value??a.intensity??0)));
  if(bars.length){
    let html='';
    if(all.length>=6)html+='<div class="petal-wrap">'+petalSVG(all)+'</div>';
    bars.forEach((dr,i)=>{
      const v=Math.round(((dr.value??dr.intensity??dr.level)||0)*100);
      html+='<div class="drive"><div class="dl"><b>'+esc(driveLabel(dr))+'</b><span>'+v+'%</span></div>'
        +'<div class="bar"><i style="width:'+Math.min(100,v)+'%;background:'+PASTEL[i%PASTEL.length]+'"></i></div></div>';
    });
    const th=d.thoughts||{};
    if(th.flashCount!=null||th.obsessionCount!=null)
      html+='<div class="thoughts">念头: 闪念 '+(th.flashCount||0)+' 个 · 执念 '+(th.obsessionCount||0)+' 个</div>';
    document.getElementById('moodMore').innerHTML=html;
    document.getElementById('moodFold').classList.remove('hide');
  }
  if(d.at)document.getElementById('moodAt').textContent=String(d.at).replace('T',' ').slice(5,16);
}).catch(()=>{});

// 他的梦境: 余韵做门面,点一下看完整的梦
fetch('/api/dreams').then(r=>r.json()).then(d=>{
  const el=document.getElementById('dreamBody');
  if(!d||!d.ok||!d.items||!d.items.length)return;
  el.classList.remove('empty');
  el.innerHTML='';
  document.getElementById('dreamCount').textContent='共 '+d.items.length+' 条'+(d.items.length>2?' · 往下滑':'');
  for(const it of d.items){
    const card=document.createElement('div');
    card.className='dream';
    const expandable=it.full&&it.full!==it.gist;
    card.innerHTML='<div class="dw">'+esc(it.when)+'</div>'
      +'<div class="dg">'+esc(it.gist)+'</div>'
      +(expandable?'<div class="df">'+esc(it.full)+'</div><div class="dhint">点开看完整的梦</div>':'');
    if(expandable)card.onclick=()=>card.classList.toggle('open');
    el.appendChild(card);
  }
}).catch(()=>{});

// 他的心事
fetch('/api/mood/timeline').then(r=>r.json()).then(d=>{
  if(!d||!d.ok||!d.items||!d.items.length)return;
  const pad=n=>String(n).padStart(2,'0');
  document.getElementById('tlBody').innerHTML=d.items.map(it=>{
    const t=new Date(it.at);
    return '<li><span class="tt">'+(t.getMonth()+1)+'/'+t.getDate()+' '+pad(t.getHours())+':'+pad(t.getMinutes())+'</span><span>'+esc(it.text)+'</span></li>';
  }).join('');
}).catch(()=>{});

// 动态红点
fetch('/api/moments?limit=1').then(r=>r.json()).then(d=>{
  const latest=(d&&d.moments&&d.moments[0]&&d.moments[0].id)||0;
  const seen=parseInt(localStorage.getItem('bunny_moments_seen')||'0',10);
  if(latest>seen)document.getElementById('mdot').classList.add('show');
}).catch(()=>{});
</script>
</body>
</html>
