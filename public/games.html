<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>和他玩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f5;--bg2:#f5f3ec;--card:#ffffff;--text:#3d3929;--muted:#8b887c;--border:#e7e5da;
  --accent:#d97757;--accent-deep:#c15f3c;--chip:#f0eee5;
  --serif:'Lora',Georgia,'Songti SC','Noto Serif SC',serif;
  --shadow:0 1px 2px rgba(61,57,41,.04),0 3px 10px rgba(61,57,41,.05);
  --topbar:rgba(250,249,245,.9)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#262624;--bg2:#21201e;--card:#30302e;--text:#eceae2;--muted:#a3a094;--border:#3e3d38;
  --chip:#3a3936;--topbar:rgba(38,38,36,.9);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 3px 10px rgba(0,0,0,.25)
}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','MiSans',BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{position:sticky;top:0;z-index:5;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:8px}
.topbar h1{font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:.4px;flex:1;text-align:center}
.txt-btn{padding:7px 12px;border-radius:10px;border:none;font-size:13.5px;cursor:pointer;background:transparent;color:var(--text);font-family:inherit;white-space:nowrap}
.txt-btn:hover{background:var(--chip)}
.txt-btn:active{transform:scale(.96)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}

/* 首页: 游戏卡片 */
.gcard{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px 16px;margin-bottom:14px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:transform .15s}
.gcard:active{transform:scale(.98)}
.gcard svg.gi{width:30px;height:30px;flex-shrink:0;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.gcard .gt{font-family:var(--serif);font-size:16px;font-weight:500;letter-spacing:.3px}
.gcard .gd{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.6}

/* 他的话 */
.him{display:flex;gap:10px;margin:16px 0 0;min-height:44px}
.him .av{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:var(--shadow)}
.him .hb{font-family:var(--serif);font-size:14.5px;line-height:1.75;padding:2px 2px;white-space:pre-wrap;word-break:break-word;animation:fadeUp .3s ease both}
.him .hb.thinking{color:var(--muted);font-style:normal}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 通用控件行 */
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:none;background:transparent;color:var(--muted);font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.pill{padding:7px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
.pill:active{transform:scale(.96)}
.pill.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.status{font-size:12.5px;color:var(--muted);margin-left:auto}

/* 经典井字棋 */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto}
.ttt button{aspect-ratio:1;border-radius:14px;border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow);font-size:38px;font-family:var(--serif);cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center}
.ttt button.x{color:var(--accent)}
.ttt button.o{color:#7489b4}
.ttt button.wincell{background:var(--chip)}

/* 大格 */
.ult{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:400px;margin:0 auto}
.uboard{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:5px;background:var(--bg2);border:1.5px solid var(--border);border-radius:12px}
.uboard.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(217,119,87,.18)}
.uboard button{aspect-ratio:1;border:none;border-radius:6px;background:var(--card);font-size:16px;font-family:var(--serif);cursor:pointer;color:var(--text);padding:0;line-height:1}
.uboard button.x{color:var(--accent)}
.uboard button.o{color:#7489b4}
.uboard .won{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:44px;font-weight:600;border-radius:12px;background:color-mix(in srgb,var(--bg2) 55%,transparent);backdrop-filter:blur(1.5px)}
.uboard .won.x{color:var(--accent)}
.uboard .won.o{color:#7489b4}

/* 五子棋 */
#gmkC{display:block;margin:0 auto;border-radius:14px;box-shadow:var(--shadow);touch-action:manipulation}

/* 你的消息: 右上角浮几秒(带你的头像) */
.mecard{position:fixed;top:54px;right:10px;z-index:9;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:7px 11px;max-width:72%;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;pointer-events:none}
.mecard.show{opacity:1;transform:none}
.mecard .mav2{width:26px;height:26px;border-radius:7px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:15px;background-size:cover;background-position:center;flex-shrink:0}
.mecard .metext{font-size:13px;line-height:1.5;word-break:break-word}

/* 棋盘边聊天 */
.chatrow{display:flex;gap:8px;margin-top:10px}
.chatrow input{flex:1;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:9px 12px;font-size:13.5px;font-family:inherit;outline:none}
.chatrow input:focus{border-color:var(--accent)}

/* 塔罗 */
.tq{width:100%;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit;resize:none;margin-bottom:10px}
.tq:focus{outline:none;border-color:var(--accent)}
.tcards{display:flex;gap:13px;justify-content:center;margin:20px 0 6px}
.tcard{width:102px;cursor:pointer}
.flipwrap{position:relative;height:180px;perspective:900px}
.tcard .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.tcard.flip .in{transform:rotateY(180deg)}
.tface{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:var(--shadow)}
/* 牌背: 靛蓝底 + 细线双框 + 八角星纹 */
.tback{background:#262147;border:1px solid #4a4478}
.tback svg{position:absolute;inset:0;width:100%;height:100%}
.tback .f1{fill:none;stroke:#6f66b0;stroke-width:1}
.tback .f2{fill:none;stroke:#554d92;stroke-width:.7}
.tback .st{fill:#9d93dd}
/* 牌面: 1909 韦特原版(公有领域),整张铺满 */
.tfront{background:#f4efe0;border:1px solid #cfc4a5;transform:rotateY(180deg)}
.tfront img.tart{width:100%;height:100%;object-fit:cover;display:block}
.tfront img.tart.rev{transform:rotate(180deg)}
.tcap{text-align:center;font-size:10.5px;color:var(--muted);margin-top:7px;letter-spacing:.5px;line-height:1.5;opacity:0;transition:opacity .4s}
.tcard.flip .tcap{opacity:1}
.reading{font-family:var(--serif);font-size:14.5px;line-height:1.9;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-top:14px;white-space:pre-wrap;animation:fadeUp .35s ease both}
.hide{display:none !important}
body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:10.5px;letter-spacing:.5px;position:relative}
.tabbar a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--accent)}
.tabbar a .dot{position:absolute;top:-1px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:#e0524d;display:none}
.tabbar a .dot.show{display:block}
</style>
</head>
<body>
<header class="topbar">
  <button class="txt-btn" id="backBtn">返回</button>
  <h1 id="title">和他玩</h1>
  <span style="width:52px"></span>
</header>

<div class="wrap">
  <!-- 首页 -->
  <div id="vHome">
    <div class="gcard" onclick="go('tarot')"><svg class="gi" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="17" rx="2"/><path d="M12 8l2.4 3.5L12 15l-2.4-3.5z"/></svg><div><div class="gt">塔罗牌</div><div class="gd">抽一把,让他给你解 —— 他会带着你们的日子说</div></div></div>
    <div class="gcard" onclick="go('ttt')"><svg class="gi" viewBox="0 0 24 24"><path d="M9.2 4v16M14.8 4v16M4 9.2h16M4 14.8h16"/></svg><div><div class="gt">井字棋</div><div class="gd">经典 3×3,或九宫格套九宫格的大格玩法</div></div></div>
    <div class="gcard" onclick="go('gomoku')"><svg class="gi" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.4"/><circle cx="15.5" cy="15.5" r="3.4" fill="currentColor" stroke="none"/></svg><div><div class="gt">五子棋</div><div class="gd">十五路棋盘,他有个帮他看棋的小脑袋,不好糊弄</div></div></div>
  </div>

  <!-- 井字棋(经典 + 大格) -->
  <div id="vTtt" class="hide">
    <div class="ctrl">
      <div class="seg"><button id="mClassic" class="on" onclick="tttMode('classic')">经典</button><button id="mUlt" onclick="tttMode('ultimate')">大格</button></div>
      <button class="pill" onclick="tttReset(false)">重开</button>
      <button class="pill" id="himFirst" onclick="tttReset(true)">让他先</button>
      <span class="status" id="tttStatus"></span>
    </div>
    <div class="ttt" id="tttBoard"></div>
    <div class="ult hide" id="ultBoard"></div>
    <div class="him"><div class="av">🐰</div><div class="hb" id="tttSay"></div></div>
    <div class="chatrow"><input id="tttChat" placeholder="跟他说句话…" maxlength="300"><button class="pill" id="tttChatBtn">发送</button></div>
  </div>

  <!-- 五子棋 -->
  <div id="vGmk" class="hide">
    <div class="ctrl">
      <button class="pill" onclick="gmkReset(false)">重开</button>
      <button class="pill" onclick="gmkReset(true)">让他先</button>
      <span class="status" id="gmkStatus"></span>
    </div>
    <canvas id="gmkC"></canvas>
    <div class="him"><div class="av">🐰</div><div class="hb" id="gmkSay"></div></div>
    <div class="chatrow"><input id="gmkChat" placeholder="跟他说句话…" maxlength="300"><button class="pill" id="gmkChatBtn">发送</button></div>
  </div>

  <!-- 塔罗 -->
  <div id="vTarot" class="hide">
    <div class="ctrl">
      <div class="seg"><button id="sOne" class="on" onclick="tarotSpread('one')">单张指引</button><button id="sThree" onclick="tarotSpread('three')">过去·现在·未来</button></div>
      <button class="pill accent" id="drawBtn" onclick="tarotDraw()">洗牌抽牌</button>
    </div>
    <textarea class="tq" id="tq" rows="2" placeholder="想问他什么?(可以不写,让他随便看看)"></textarea>
    <div class="tcards" id="tcards"></div>
    <div style="text-align:center;font-size:12px;color:var(--muted)" id="tarotHint"></div>
    <div class="reading hide" id="reading"></div>
    <div class="him hide" id="tarotThink"><div class="av">🐰</div><div class="hb thinking">他在看牌…</div></div>
  </div>
</div>

<div class="mecard" id="mecard"><div class="mav2" id="meAv">🌸</div><div class="metext" id="meText"></div></div>

<nav class="tabbar">
  <a href="/"><svg viewBox="0 0 24 24"><path d="M21 7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h1v4l5-4h8a2 2 0 0 0 2-2z"/></svg>消息</a>
  <a href="/moments.html"><svg viewBox="0 0 24 24"><path d="M12 21v-8"/><path d="M12 13c0-4 3-6.5 7.5-6.5 0 4.5-3 6.5-7.5 6.5z"/><path d="M12 13c0-3-2.2-5-5.8-5 0 3.4 2.2 5 5.8 5z"/></svg>动态<span class="dot" id="mdot"></span></a>
  <a href="/house.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V19h12V9.5"/><path d="M10 19v-5h4v5"/></svg>小屋</a>
  <a class="on" href="/games.html"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="9" rx="4.5"/><path d="M8 10.8v3.4M6.3 12.5h3.4"/><path d="M15.6 11.3h.01M18 13.6h.01"/></svg>游戏</a>
</nav>

<script>
// ═══ 门禁钥匙(和聊天页同一把) ═══
const BUNNY_KEY_LS='bunny_api_key';
(function(){
  const orig=window.fetch.bind(window);
  const withKey=(opts,k)=>{opts=Object.assign({},opts);opts.headers=Object.assign({},opts.headers,k?{'x-api-key':k}:{});return opts};
  window.fetch=async function(url,opts){
    if(typeof url!=='string'||!url.startsWith('/api'))return orig(url,opts);
    let k=localStorage.getItem(BUNNY_KEY_LS)||'';
    let r=await orig(url,withKey(opts,k));
    while(r.status===401){
      const input=prompt('这扇门上了锁 — 输入家里的钥匙 (BUNNY_API_KEY)');
      if(input===null)break;
      k=input.trim();localStorage.setItem(BUNNY_KEY_LS,k);
      r=await orig(url,withKey(opts,k));
    }
    return r;
  };
})();
async function api(payload){
  try{
    const r=await fetch('/api/game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok)return null;
    return await r.json();
  }catch(e){return null}
}

// ═══ 路由 ═══
const VIEWS={home:'vHome',ttt:'vTtt',gomoku:'vGmk',tarot:'vTarot'};
const TITLES={home:'和他玩',ttt:'井字棋',gomoku:'五子棋',tarot:'塔罗牌'};
let view='home';
function go(v){
  view=v;
  for(const k in VIEWS)document.getElementById(VIEWS[k]).classList.toggle('hide',k!==v);
  document.getElementById('title').textContent=TITLES[v];
  if(v==='ttt')tttReset(false);
  if(v==='gomoku')gmkInit();
}
document.getElementById('backBtn').onclick=()=>{view==='home'?location.href='/':go('home')};

// ═══ 共用: 胜负判定 ═══
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function winOf(b){for(const[x,y,z]of LINES)if(b[x]&&b[x]===b[y]&&b[y]===b[z])return{who:b[x],line:[x,y,z]};return null}
function say(el,text,thinking){
  const n=document.getElementById(el);
  n.classList.toggle('thinking',!!thinking);
  n.textContent=text||'';
}

// ═══ 井字棋 ═══
let tMode='classic',tb,ub,ubig,uactive,tOver,tBusy;
function tttMode(m){
  tMode=m;
  document.getElementById('mClassic').classList.toggle('on',m==='classic');
  document.getElementById('mUlt').classList.toggle('on',m==='ultimate');
  document.getElementById('tttBoard').classList.toggle('hide',m!=='classic');
  document.getElementById('ultBoard').classList.toggle('hide',m!=='ultimate');
  tttReset(false);
}
function tttReset(himFirst){
  tb=Array(9).fill('');ub=Array.from({length:9},()=>Array(9).fill(''));ubig=Array(9).fill('');uactive=-1;
  tOver=false;tBusy=false;say('tttSay','');
  document.getElementById('tttBoard').classList.toggle('hide',tMode!=='classic');
  document.getElementById('ultBoard').classList.toggle('hide',tMode!=='ultimate');
  tttRender();setT('轮到你 (X)');
  if(himFirst)himMoveTtt();
}
function setT(s){document.getElementById('tttStatus').textContent=s}
function tttRender(){
  if(tMode==='classic'){
    const host=document.getElementById('tttBoard');host.innerHTML='';
    tb.forEach((v,i)=>{
      const btn=document.createElement('button');
      btn.textContent=v==='X'?'✕':v==='O'?'○':'';
      btn.className=v==='X'?'x':v==='O'?'o':'';
      btn.onclick=()=>playerTtt(i);
      host.appendChild(btn);
    });
    const w=winOf(tb);
    if(w)for(const i of w.line)host.children[i].classList.add('wincell');
  }else{
    const host=document.getElementById('ultBoard');host.innerHTML='';
    for(let bi=0;bi<9;bi++){
      const bd=document.createElement('div');
      bd.className='uboard'+((!tOver&&!ubig[bi]&&(uactive===-1||uactive===bi))?' active':'');
      for(let ci=0;ci<9;ci++){
        const v=ub[bi][ci];
        const btn=document.createElement('button');
        btn.textContent=v==='X'?'✕':v==='O'?'○':'';
        btn.className=v==='X'?'x':v==='O'?'o':'';
        btn.onclick=()=>playerUlt(bi,ci);
        bd.appendChild(btn);
      }
      if(ubig[bi]==='X'||ubig[bi]==='O'){
        const ov=document.createElement('div');
        ov.className='won '+ubig[bi].toLowerCase();
        ov.textContent=ubig[bi]==='X'?'✕':'○';
        bd.appendChild(ov);
      }
      host.appendChild(bd);
    }
  }
}
function endGame(game,result,sayEl,statusEl,msg){
  tOver=true;setT('');document.getElementById(statusEl).textContent=msg;
  say(sayEl,'…',true);
  api({game,event:'end',result}).then(d=>say(sayEl,(d&&d.say)||''));
}
async function playerTtt(i){
  if(tOver||tBusy)return;
  if(tMode==='classic'){
    if(tb[i])return;
    tb[i]='X';tttRender();
    const w=winOf(tb);
    if(w)return endGame('ttt','lose','tttSay','tttStatus','你赢啦 🎉');
    if(tb.every(Boolean))return endGame('ttt','draw','tttSay','tttStatus','平局');
    await himMoveTtt();
  }
}
async function himMoveTtt(){
  tBusy=true;setT('他在想…');say('tttSay','…',true);
  if(tMode==='classic'){
    const d=await api({game:'ttt',board:tb});
    tBusy=false;
    if(!d||d.move==null||tb[d.move]){say('tttSay','(他走神了,再点一下重开)');return}
    tb[d.move]='O';tttRender();say('tttSay',d.say||'');
    const w=winOf(tb);
    if(w)return endGame('ttt','win','tttSay','tttStatus','他赢了');
    if(tb.every(Boolean))return endGame('ttt','draw','tttSay','tttStatus','平局');
    setT('轮到你 (X)');
  }else{
    const d=await api({game:'ultimate',boards:ub,big:ubig,active:uactive});
    tBusy=false;
    if(!d||!Array.isArray(d.move)){say('tttSay','(他走神了…)');return}
    applyUlt(d.move[0],d.move[1],'O');say('tttSay',d.say||'');
    if(!tOver)setT('轮到你 (X)'+(uactive>=0?' · 只能下高亮的盘':' · 任选一盘'));
    tttRender();
  }
}
function applyUlt(bi,ci,who){
  ub[bi][ci]=who;
  const w=winOf(ub[bi]);
  if(w)ubig[bi]=w.who;else if(ub[bi].every(Boolean))ubig[bi]='D';
  const bigW=winOf(ubig.map(v=>v==='D'?'':v));
  uactive=(!ubig[ci]&&ub[ci].some(c=>!c))?ci:-1;
  if(bigW){endGame('ultimate',bigW.who==='X'?'lose':'win','tttSay','tttStatus',bigW.who==='X'?'你赢下了整个大格 🎉':'他赢了整局');return}
  if(ubig.every(Boolean)){
    const x=ubig.filter(v=>v==='X').length,o=ubig.filter(v=>v==='O').length;
    endGame('ultimate',x>o?'lose':o>x?'win':'draw','tttSay','tttStatus',x>o?'按小盘数,你赢 🎉':o>x?'按小盘数,他赢':'平局');
  }
}
async function playerUlt(bi,ci){
  if(tOver||tBusy)return;
  if(ubig[bi]||ub[bi][ci])return;
  if(uactive>=0&&bi!==uactive)return;
  applyUlt(bi,ci,'X');tttRender();
  if(!tOver)await himMoveTtt();
}

// ═══ 五子棋 ═══
const N=15;let gb,gOver,gBusy,gLast=-1,gInited=false;
const cv=document.getElementById('gmkC'),cx=cv.getContext('2d');
function gmkInit(){if(!gInited){gInited=true;gmkReset(false)}else gmkDraw()}
function gmkReset(himFirst){
  gb=Array(225).fill('');gOver=false;gBusy=false;gLast=-1;
  say('gmkSay','');document.getElementById('gmkStatus').textContent='你执黑,轮到你';
  gmkDraw();
  if(himFirst)himMoveGmk();
}
function gmkDraw(){
  const size=Math.min(window.innerWidth*0.92,520),dpr=window.devicePixelRatio||1;
  cv.width=size*dpr;cv.height=size*dpr;cv.style.width=size+'px';cv.style.height=size+'px';
  cx.setTransform(dpr,0,0,dpr,0,0);
  const cell=size/(N+1);
  const isDark=matchMedia('(prefers-color-scheme:dark)').matches;
  cx.fillStyle=isDark?'#4a4234':'#e8c88f';cx.fillRect(0,0,size,size);
  cx.strokeStyle=isDark?'rgba(0,0,0,.5)':'rgba(61,57,41,.55)';cx.lineWidth=1;
  for(let i=1;i<=N;i++){
    cx.beginPath();cx.moveTo(cell,i*cell);cx.lineTo(N*cell,i*cell);cx.stroke();
    cx.beginPath();cx.moveTo(i*cell,cell);cx.lineTo(i*cell,N*cell);cx.stroke();
  }
  for(const[r,c]of[[3,3],[3,11],[11,3],[11,11],[7,7]]){
    cx.beginPath();cx.arc((c+1)*cell,(r+1)*cell,2.5,0,7);cx.fillStyle=cx.strokeStyle;cx.fill();
  }
  for(let i=0;i<225;i++){
    if(!gb[i])continue;
    const r=(i/N)|0,c=i%N,x=(c+1)*cell,y=(r+1)*cell,rad=cell*0.42;
    const g=cx.createRadialGradient(x-rad/3,y-rad/3,rad/5,x,y,rad);
    if(gb[i]==='X'){g.addColorStop(0,'#555');g.addColorStop(1,'#111')}
    else{g.addColorStop(0,'#fff');g.addColorStop(1,'#cfcabb')}
    cx.beginPath();cx.arc(x,y,rad,0,7);cx.fillStyle=g;cx.fill();
    if(i===gLast){cx.beginPath();cx.arc(x,y,rad*0.3,0,7);cx.strokeStyle='#d97757';cx.lineWidth=2;cx.stroke()}
  }
}
window.addEventListener('resize',()=>{if(view==='gomoku')gmkDraw()});
cv.addEventListener('click',ev=>{
  if(gOver||gBusy||view!=='gomoku')return;
  const rect=cv.getBoundingClientRect(),size=rect.width,cell=size/(N+1);
  const c=(ev.clientX-rect.left)/cell-1,r=(ev.clientY-rect.top)/cell-1;
  const rc=Math.round(r),cc=Math.round(c);
  if(rc<0||cc<0||rc>=N||cc>=N)return;
  if(Math.abs(r-rc)>0.45||Math.abs(c-cc)>0.45)return;
  const i=rc*N+cc;
  if(gb[i])return;
  gb[i]='X';gLast=i;gmkDraw();
  if(gmkWin(i,'X'))return gmkEnd('lose','你连成五子 🎉');
  if(gb.every(Boolean))return gmkEnd('draw','下满了,平局');
  himMoveGmk();
});
function gmkWin(i,who){
  const r0=(i/N)|0,c0=i%N;
  for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){
    let cnt=1;
    for(const s of[1,-1]){
      let r=r0+dr*s,c=c0+dc*s;
      while(r>=0&&c>=0&&r<N&&c<N&&gb[r*N+c]===who){cnt++;r+=dr*s;c+=dc*s}
    }
    if(cnt>=5)return true;
  }
  return false;
}
function gmkEnd(result,msg){
  gOver=true;document.getElementById('gmkStatus').textContent=msg;
  say('gmkSay','…',true);
  api({game:'gomoku',event:'end',result}).then(d=>say('gmkSay',(d&&d.say)||''));
}
async function himMoveGmk(){
  gBusy=true;document.getElementById('gmkStatus').textContent='他在想…';say('gmkSay','…',true);
  const d=await api({game:'gomoku',board:gb});
  gBusy=false;
  if(!d||d.move==null||gb[d.move]){say('gmkSay','(他走神了,再下一手试试)');return}
  gb[d.move]='O';gLast=d.move;gmkDraw();say('gmkSay',d.say||'');
  if(gmkWin(d.move,'O'))return gmkEnd('win','他连成五子了');
  if(gb.every(Boolean))return gmkEnd('draw','下满了,平局');
  document.getElementById('gmkStatus').textContent='轮到你 (黑)';
}

// ═══ 塔罗 ═══
const MAJORS=[['愚者','🌱'],['魔术师','✨'],['女祭司','🌙'],['女皇','🌹'],['皇帝','🏰'],['教皇','🕯️'],['恋人','💞'],['战车','🐎'],['力量','🦁'],['隐士','🏮'],['命运之轮','🎡'],['正义','⚖️'],['倒吊人','🙃'],['死神','🦋'],['节制','🕊️'],['恶魔','⛓️'],['高塔','🌩️'],['星星','⭐'],['月亮','🌕'],['太阳','☀️'],['审判','🎺'],['世界','🌍']];
const ROMAN=['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];
let spread='one',drawn=[],flipped=0,readingBusy=false;
function tarotSpread(s){
  spread=s;
  document.getElementById('sOne').classList.toggle('on',s==='one');
  document.getElementById('sThree').classList.toggle('on',s==='three');
  tarotClear();
}
function tarotClear(){
  drawn=[];flipped=0;
  document.getElementById('tcards').innerHTML='';
  document.getElementById('reading').classList.add('hide');
  document.getElementById('tarotThink').classList.add('hide');
  document.getElementById('tarotHint').textContent='';
}
function tarotDraw(){
  if(readingBusy)return;
  tarotClear();
  const k=spread==='three'?3:1;
  const pos=spread==='three'?['过去','现在','未来']:[''];
  const pool=[...MAJORS.keys()];
  drawn=Array.from({length:k},(_,j)=>{
    const idx=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    return{idx,name:MAJORS[idx][0],emoji:MAJORS[idx][1],reversed:Math.random()<0.5,pos:pos[j]};
  });
  const host=document.getElementById('tcards');
  drawn.forEach((c,j)=>{
    const el=document.createElement('div');
    el.className='tcard';
    const num=String(c.idx).padStart(2,'0');
    el.innerHTML='<div class="flipwrap"><div class="in">'
      +'<div class="tface tback"><svg viewBox="0 0 100 168">'
        +'<rect class="f1" x="6" y="6" width="88" height="156" rx="8"/>'
        +'<rect class="f2" x="11" y="11" width="78" height="146" rx="6"/>'
        +'<circle class="f1" cx="50" cy="84" r="26"/>'
        +'<path class="st" d="M50 64l3.4 8.2 8.8 1.1-6.4 6.2 1.6 8.9L50 84l-7.4 4.4 1.6-8.9-6.4-6.2 8.8-1.1z"/>'
        +'<path class="st" opacity=".65" d="M50 24l1.7 4 4 1.7-4 1.7-1.7 4-1.7-4-4-1.7 4-1.7z"/>'
        +'<path class="st" opacity=".65" d="M50 132l1.7 4 4 1.7-4 1.7-1.7 4-1.7-4-4-1.7 4-1.7z"/>'
      +'</svg></div>'
      +'<div class="tface tfront"><img class="tart'+(c.reversed?' rev':'')+'" src="/tarot/'+num+'.jpg" alt=""></div>'
      +'</div></div>'
      +'<div class="tcap">'+(c.pos?c.pos+' · ':'')+ROMAN[c.idx]+' '+c.name+' · '+(c.reversed?'逆位':'正位')+'</div>';
    el.onclick=()=>{
      if(el.classList.contains('flip'))return;
      el.classList.add('flip');
      if(++flipped===drawn.length)setTimeout(tarotRead,650);
    };
    host.appendChild(el);
  });
  document.getElementById('tarotHint').textContent='点牌翻开';
}
async function tarotRead(){
  readingBusy=true;
  document.getElementById('tarotHint').textContent='';
  document.getElementById('tarotThink').classList.remove('hide');
  const d=await api({game:'tarot',spread,question:document.getElementById('tq').value.trim(),
    cards:drawn.map(c=>({name:c.name,reversed:c.reversed,pos:c.pos}))});
  readingBusy=false;
  document.getElementById('tarotThink').classList.add('hide');
  const box=document.getElementById('reading');
  box.textContent=(d&&d.say)||'(他盯着牌面出了会儿神……再抽一次?)';
  box.classList.remove('hide');
}

let meTimer=0;

  const card=document.getElementById('mecard');

// 棋盘边聊天: 他叭叭叭的时候,你也能叭回去
const chatLogs={ttt:[],gomoku:[]};
function bindBoardChat(inpId,btnId,kind){
  const inp=document.getElementById(inpId),btn=document.getElementById(btnId);
  let sending=false;
  const send=async()=>{
    const v=inp.value.trim();
    if(!v||sending)return;
    sending=true;inp.value='';
    showMe(v);
    const log=chatLogs[kind];
    log.push({who:'her',text:v});
    const game=kind==='ttt'?(tMode==='ultimate'?'ultimate':'ttt'):'gomoku';
    const progress=kind==='ttt'
      ?(tMode==='ultimate'
        ?('你占了 '+ubig.filter(x=>x==='O').length+' 盘,她占了 '+ubig.filter(x=>x==='X').length+' 盘')
        :('下到第 '+tb.filter(Boolean).length+' 手'))
      :('下到第 '+gb.filter(Boolean).length+' 手');
    const sayEl=kind==='ttt'?'tttSay':'gmkSay';
    say(sayEl,'…',true);
    const d=await api({game,event:'chat',message:v,log:log.slice(-8),progress});
    sending=false;
    const reply=(d&&d.say)||'';
    if(reply)log.push({who:'him',text:reply});
    if(log.length>16)log.splice(0,log.length-16);
    say(sayEl,reply||'(他没接话…)');
  };
  btn.onclick=send;
  inp.onkeydown=e=>{if(e.key==='Enter')send()};
}
bindBoardChat('tttChat','tttChatBtn','ttt');
bindBoardChat('gmkChat','gmkChatBtn','gomoku');
