<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f8f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#211f1c" media="(prefers-color-scheme: dark)">
<title>Bunny Home</title>
<style>
:root{
  --bg:#f8f3ec;--bg2:#f2eae0;--card:#fffdfa;--text:#3d3a35;--muted:#95908a;--border:#e9e2d8;
  --xiaoke:#e898a4;--xiaoke-deep:#d97f8e;--claude:#7489b4;--claude-deep:#5f76a6;
  --topbar:rgba(255,252,248,.82);--chip:#efe9e0;--r:18px;
  --my-bub:#e898a4;--my-bub-text:#fff;--his-bub:var(--card);--his-bub-text:var(--text);--his-bub-border:var(--border);
  --shadow:0 1px 2px rgba(80,60,40,.05),0 4px 14px rgba(80,60,40,.06)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#211f1c;--bg2:#191815;--card:#2b2823;--text:#eae5dd;--muted:#9a948a;--border:#3b362e;
  --topbar:rgba(30,28,25,.82);--chip:#37332c;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.28)
}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);height:100vh;overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column;position:relative;background:var(--chat-bg,linear-gradient(180deg,var(--bg),var(--bg2)))}
.topbar{background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar h1{font-size:16px;font-weight:700;letter-spacing:.3px}
.topbar .actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:none;font-size:16px;cursor:pointer;background:var(--chip);display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--text)}
.icon-btn:hover{transform:scale(1.06)}
.icon-btn.active{background:#5c8a5c;color:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(92,138,92,.4)}50%{box-shadow:0 0 0 8px rgba(92,138,92,0)}}
.msgs{flex:1;overflow-y:auto;padding:18px 14px 24px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:5px}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:64px 0 48px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty::before{content:'🐰';font-size:44px;animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ═══ 微信式行布局: 头像列 + 气泡 ═══ */
.row{display:flex;gap:10px;animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row.user{flex-direction:row-reverse}
.avatar{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--card);border:1px solid var(--border);background-size:cover;background-position:center;box-shadow:var(--shadow);overflow:hidden}
.bwrap{max-width:76%;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.row.user .bwrap{align-items:flex-end}
.bubble{padding:10px 13px;border-radius:13px;font-size:14.5px;line-height:1.72;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow);max-width:100%}
.bubble.assistant{background:var(--his-bub);color:var(--his-bub-text);border:1px solid var(--his-bub-border);border-top-left-radius:4px}
.bubble.user{background:var(--my-bub);color:var(--my-bub-text);border-top-right-radius:4px}
.bubble.sticker-only{background:transparent !important;border:none !important;box-shadow:none;padding:2px}
.divider{align-self:center;font-size:11.5px;color:var(--muted);background:rgba(125,115,100,.13);padding:3px 11px;border-radius:10px;backdrop-filter:blur(4px)}
.bubble img.sticker{display:block;max-width:150px;max-height:150px;border-radius:10px;margin:4px 0}

/* 语音条 (微信式,点击播他的声音) */
.vbar{display:flex;align-items:center;gap:8px;cursor:pointer;padding:1px 2px 7px;user-select:none;-webkit-user-select:none}
.vbar .vp{font-size:14px;opacity:.8}
.waves{display:flex;gap:3px;align-items:center;height:14px}
.waves i{width:3px;height:6px;border-radius:2px;background:currentColor;opacity:.5}
.waves i:nth-child(2){height:11px}.waves i:nth-child(3){height:8px}.waves i:nth-child(4){height:12px}.waves i:nth-child(5){height:7px}
.vbar.playing .waves i{animation:wv .8s ease-in-out infinite}
.vbar.playing .waves i:nth-child(2){animation-delay:.12s}.vbar.playing .waves i:nth-child(3){animation-delay:.24s}
.vbar.playing .waves i:nth-child(4){animation-delay:.36s}.vbar.playing .waves i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{transform:scaleY(.6);opacity:.5}50%{transform:scaleY(1.5);opacity:1}}
.vdur{font-size:12px;opacity:.6}

/* 内心OS: 没说出口的心思 (灰色小字,点击折叠) */
.os{margin-top:7px;padding-top:6px;border-top:1px dashed color-mix(in srgb,currentColor 22%,transparent);font-size:12.5px;color:var(--muted);cursor:pointer;line-height:1.6;font-style:italic}
.os::before{content:'💭 ';font-style:normal;font-size:11px}
.os.collapsed .os-text{display:none}
.os.collapsed::after{content:'…'}
body.hide-os .os{display:none}

/* 译 按钮 + 译文卡 */
.meta{display:flex;gap:8px;padding:0 3px}
.tbtn{font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:9px;padding:1px 9px;cursor:pointer;user-select:none;-webkit-user-select:none;background:color-mix(in srgb,var(--card) 60%,transparent)}
.tbtn:active{opacity:.6}
.tout{display:none;background:color-mix(in srgb,var(--card) 82%,transparent);border:1px solid var(--border);border-radius:11px;border-top-left-radius:4px;padding:8px 12px;font-size:13.5px;color:var(--text);opacity:.88;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.tout.show{display:block}

.input{padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;gap:9px;flex-shrink:0;align-items:flex-end}
.input textarea{flex:1;padding:11px 16px;border:1px solid var(--border);border-radius:22px;font-size:14.5px;resize:none;outline:none;background:var(--card);color:var(--text);font-family:inherit;max-height:96px;transition:border-color .2s,box-shadow .2s}
.input textarea:focus{border-color:var(--xiaoke);box-shadow:0 0 0 3px color-mix(in srgb,var(--xiaoke) 15%,transparent)}
.input textarea::placeholder{color:var(--muted)}
.input .sendbtn{padding:11px 20px;background:linear-gradient(135deg,var(--xiaoke),var(--xiaoke-deep));color:#fff;border:none;border-radius:22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:transform .15s,opacity .2s;box-shadow:var(--shadow)}
.input .sendbtn:hover{opacity:.92}.input .sendbtn:active{transform:scale(.96)}
.rnd-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);font-size:18px;cursor:pointer;flex-shrink:0;transition:transform .15s;box-shadow:var(--shadow);color:var(--text)}
.rnd-btn:active{transform:scale(.92)}
.typing{display:inline-flex;gap:5px;padding:5px 2px;align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.2s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.35}30%{transform:translateY(-4px);opacity:1}}

/* 按住说话 */
.talk-btn{flex:1;padding:11px;border:1px solid var(--border);border-radius:22px;background:var(--card);color:var(--text);font-size:14.5px;font-weight:600;text-align:center;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer}
.talk-btn.holding{background:var(--chip);transform:scale(.99)}
.hold-overlay{display:none;position:fixed;inset:0;background:rgba(20,15,18,.5);backdrop-filter:blur(3px);z-index:60;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.hold-overlay.show{display:flex}
.hold-mic{font-size:42px;animation:pulse2 1.2s ease-in-out infinite}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.hold-text{background:var(--card);color:var(--text);border-radius:14px;padding:10px 16px;max-width:78%;min-width:120px;min-height:42px;font-size:14.5px;line-height:1.6;text-align:center;box-shadow:var(--shadow)}
.hold-hint{color:rgba(255,255,255,.85);font-size:13px}
.hold-overlay.cancel .hold-mic{filter:grayscale(1);opacity:.6}
.hold-overlay.cancel .hold-hint{color:#ff9c9c}

/* Stickers */
.stk-panel{display:none;position:absolute;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom));max-height:272px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:10px;z-index:10;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.stk-panel.show{display:grid}
.stk-panel img{width:100%;aspect-ratio:1;object-fit:contain;cursor:pointer;border-radius:8px;transition:transform .12s}
.stk-panel img:active{transform:scale(.9)}

/* ═══ 装扮抽屉 ═══ */
.drawer-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:39}
.drawer-mask.show{display:block}
.drawer{position:fixed;left:0;right:0;bottom:0;max-height:74vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;border:1px solid var(--border);box-shadow:0 -8px 30px rgba(0,0,0,.18);z-index:40;padding:16px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s ease}
.drawer.show{transform:none}
.drawer .dtitle{font-size:15px;font-weight:700;text-align:center;padding-bottom:4px}
.drawer h3{font-size:12.5px;color:var(--muted);margin:15px 0 8px;font-weight:600;letter-spacing:.5px}
.swatches{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);cursor:pointer;background-size:cover;flex-shrink:0}
.sw.on{border-color:var(--xiaoke-deep);box-shadow:0 0 0 2px color-mix(in srgb,var(--xiaoke) 45%,transparent)}
.sw.custom{display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--chip);position:relative;overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;max-height:138px;overflow-y:auto;padding:2px}
.avgrid .av{aspect-ratio:1;border-radius:10px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;background-size:cover;background-position:center;background-color:var(--bg)}
.avgrid .av.on{border-color:var(--xiaoke-deep);box-shadow:0 0 0 2px color-mix(in srgb,var(--xiaoke) 40%,transparent)}
.togglerow{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px dashed var(--border);font-size:14px}
.togglerow small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.tg{position:relative;width:44px;height:25px;flex-shrink:0}
.tg input{opacity:0;width:100%;height:100%;position:absolute;cursor:pointer;z-index:1}
.tg i{position:absolute;inset:0;background:var(--chip);border-radius:13px;transition:background .2s}
.tg i::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg input:checked+i{background:var(--xiaoke)}
.tg input:checked+i::after{transform:translateX(19px)}

/* ═══ 心潮面板 ═══ */
.mood-loading{text-align:center;color:var(--muted);font-size:13.5px;padding:36px 0}
.mood-state{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted);margin-top:6px}
.mood-state b{color:var(--text);font-size:15px;font-weight:600}
.fat-row{margin:10px 2px 2px;font-size:12px;color:var(--muted)}
.fat-bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:4px}
.fat-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--xiaoke),var(--xiaoke-deep));border-radius:3px;transition:width .5s}
.petal-wrap{display:flex;justify-content:center;padding:4px 0 0}
.petal-wrap svg{max-width:320px;width:100%;height:auto}
.pl-grid{fill:none;stroke:var(--border);stroke-width:1}
.pl-axis{stroke:var(--border);stroke-width:.6;opacity:.6}
.pl-shape{fill:color-mix(in srgb,var(--xiaoke) 30%,transparent);stroke:var(--xiaoke-deep);stroke-width:1.6;stroke-linejoin:round}
.pl-dot{fill:var(--xiaoke-deep)}
.pl-label{font-size:9.5px;fill:var(--muted)}
.pl-label.hot{fill:var(--xiaoke-deep);font-weight:600}
.top-drives{margin:8px 0 2px;display:flex;flex-direction:column;gap:7px}
.td-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.td-row .n{width:118px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-row .bar{flex:1;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.td-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--claude),var(--claude-deep));border-radius:3px}
.td-row .v{width:34px;text-align:right;color:var(--muted);font-size:11.5px}
.mood-dreams{margin-top:6px;font-size:12.5px;color:var(--muted);line-height:1.9}
.mood-dreams .d{display:flex;justify-content:space-between}
.mood-dreams .lu{letter-spacing:2px}
.mood-foot{text-align:center;margin-top:10px}
.mood-foot button{border:1px solid var(--border);background:var(--chip);color:var(--text);border-radius:14px;padding:5px 16px;font-size:12.5px;cursor:pointer;font-family:inherit}

/* Call overlay — 暖夜色 */
.call-overlay{display:none;position:fixed;inset:0;background:linear-gradient(170deg,#2b1f26 0%,#3d2732 45%,#241a20 100%);z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden}
.call-overlay.show{display:flex}
.call-overlay::before,.call-overlay::after{content:'';position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none}
.call-overlay::before{width:280px;height:280px;background:#e898a4;top:-70px;right:-70px;animation:drift 9s ease-in-out infinite}
.call-overlay::after{width:240px;height:240px;background:#7489b4;bottom:-60px;left:-60px;animation:drift 11s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-18px,14px) scale(1.08)}}
.call-overlay .call-avatar{width:104px;height:104px;border-radius:50%;background:rgba(232,152,164,.16);border:1px solid rgba(232,152,164,.35);display:flex;align-items:center;justify-content:center;font-size:50px;animation:avatarPulse 3s ease-in-out infinite;position:relative;z-index:1;background-size:cover;background-position:center;overflow:hidden}
.call-overlay .call-avatar::before,.call-overlay .call-avatar::after{content:'';position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(232,152,164,.45);animation:ripple 3s ease-out infinite}
.call-overlay .call-avatar::after{animation-delay:1.5s}
@keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.75);opacity:0}}
@keyframes avatarPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.call-overlay .call-name{font-size:21px;color:#fdf6f2;font-weight:600;letter-spacing:1px;z-index:1}
.call-overlay .call-subtitle{font-size:14px;color:rgba(253,246,242,.72);min-height:20px;text-align:center;max-width:320px;line-height:1.7;transition:opacity .3s;padding:0 24px;z-index:1}
.call-overlay .call-my-words{font-size:13px;color:rgba(253,246,242,.4);min-height:18px;text-align:center;max-width:280px;line-height:1.5;margin-top:-8px;z-index:1}
.call-overlay .call-recording{color:#ff8f8f;animation:blink 1s infinite;font-size:12px;display:none;align-items:center;gap:6px;z-index:1}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.call-overlay .call-recording.show{display:flex}
.call-overlay .call-recording::before{content:'';width:8px;height:8px;border-radius:50%;background:#ff8f8f}
.call-overlay .call-hangup{width:64px;height:64px;border-radius:50%;border:none;background:linear-gradient(135deg,#e5697c,#cf4f63);color:#fff;font-size:26px;cursor:pointer;margin-top:14px;transition:transform .2s;box-shadow:0 6px 20px rgba(207,79,99,.4);z-index:1}
.call-overlay .call-hangup:hover{transform:scale(1.08)}
.call-overlay .call-hangup:active{transform:scale(.94)}
.call-timer{font-size:13px;color:rgba(253,246,242,.45);letter-spacing:2px;z-index:1}
.call-mic-error{font-size:12px;color:#ff8f8f;text-align:center;max-width:280px;line-height:1.5;z-index:1}
.call-perm-btn{padding:12px 28px;border-radius:24px;border:1px solid rgba(253,246,242,.25);background:rgba(253,246,242,.12);backdrop-filter:blur(8px);color:#fdf6f2;font-size:15px;cursor:pointer;font-family:inherit;margin-top:8px;transition:background .2s;z-index:1}
.call-perm-btn:hover{background:rgba(253,246,242,.22)}

@media(max-width:500px){.bwrap{max-width:82%}.input textarea{font-size:16px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <h1 id="title">🐰 小克</h1>
    <div class="actions">
      <button class="icon-btn" onclick="toggleMood()" title="他的心">💗</button>
      <button class="icon-btn" onclick="toggleDrawer()" title="装扮">🎨</button>
      <button class="icon-btn" id="callBtn" onclick="toggleCall()" title="语音通话">📞</button>
    </div>
  </header>
  <main class="msgs" id="msgs">
    <div class="empty" id="welcome">嘉嘉在等你。</div>
  </main>
  <div class="stk-panel" id="stkpanel"></div>
  <footer class="input">
    <button class="rnd-btn" id="modeBtn" onclick="toggleVoiceMode()" title="语音输入">🎤</button>
    <textarea id="inp" placeholder="说点什么…" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <div class="talk-btn" id="talkBtn" style="display:none">按住 说话</div>
    <button class="rnd-btn" id="stkbtn" onclick="toggleStickers()" title="表情包">😊</button>
    <button class="sendbtn" id="sendbtn" onclick="send()">发送</button>
  </footer>
</div>

<!-- 按住说话浮层 -->
<div class="hold-overlay" id="holdOverlay">
  <div class="hold-mic">🎙️</div>
  <div class="hold-text" id="holdText">我在听…</div>
  <div class="hold-hint" id="holdHint">松开发送 · 上滑取消</div>
</div>

<!-- 装扮抽屉 -->
<div class="drawer-mask" id="drawerMask" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="dtitle">🎨 装扮小家</div>
  <h3>聊天背景</h3>
  <div class="swatches" id="bgRow"></div>
  <h3>我的气泡</h3>
  <div class="swatches" id="myBubRow"></div>
  <h3>他的气泡</h3>
  <div class="swatches" id="hisBubRow"></div>
  <h3>小克的头像</h3>
  <div class="avgrid" id="kAvGrid"></div>
  <h3>我的头像</h3>
  <div class="avgrid" id="myAvGrid"></div>
  <h3>开关</h3>
  <div class="togglerow"><div>他的语音条<small>他的消息带一条可播放的语音</small></div><label class="tg"><input type="checkbox" id="tgVoice"><i></i></label></div>
  <div class="togglerow"><div>心声<small>他回复末尾那句没说出口的心思</small></div><label class="tg"><input type="checkbox" id="tgOS"><i></i></label></div>
  <div class="togglerow" style="border-bottom:none"><div>指尖<small>让他感知你打字的犹豫(只传节奏,不传内容)</small></div><label class="tg"><input type="checkbox" id="tgFinger"><i></i></label></div>
</div>

<!-- 心潮面板: 他的心 -->
<div class="drawer-mask" id="moodMask" onclick="toggleMood()"></div>
<div class="drawer" id="moodDrawer">
  <div class="dtitle">🌊 他此刻的心</div>
  <div id="moodBody"><div class="mood-loading">正在摸他的心…</div></div>
</div>

<div class="call-overlay" id="callOverlay">

  <div class="call-avatar" id="callAvatar">🐰</div>

<script>
let persona='xiaoke',loading=!1,sessionId=null,callOpen=!1,callTimer=0,callInterval=null;
let recognition=null,recognitionWanted=!1,audioCtx=null,speaking=!1,speakQueue=[];

// ═══ 装扮系统 ═══════════════════════════════════════════
// 全存 localStorage,不动后端。头像可选表情包库里的任何一张图。
const DECOR_KEY='bunny_decor_v1';
const BGS={
  '默认':'', '奶油':'#f6efe4',
  '樱粉':'linear-gradient(180deg,#fdeef1,#f5dfe7)',
  '薄荷':'linear-gradient(180deg,#eaf5ee,#dcefe5)',
  '雾蓝':'linear-gradient(180deg,#e9eff8,#dfe7f3)',
  '暖夜':'linear-gradient(180deg,#282130,#1a1622)'
};
const MY_BUBS=['#e898a4','#95ec69','#7489b4','#b48ac9','#f3b26a','#fffdfa'];
const HIS_BUBS=['default','#fffdfa','#fbe9ec','#e8edf7','#effae9','#f5eedd'];
const EMOJI_AVS=['🐰','🥕','🌸','🌙','✨','💌','🐇','☁️'];
let decor={bg:'默认',myBub:'#e898a4',hisBub:'default',kAv:'emoji:🐰',myAv:'emoji:🌸',voiceBar:!0,showOS:!0,fingertips:!0};
try{Object.assign(decor,JSON.parse(localStorage.getItem(DECOR_KEY)||'{}'))}catch(e){}
function saveDecor(){try{localStorage.setItem(DECOR_KEY,JSON.stringify(decor))}catch(e){}}

function textOn(hex){ // 按亮度决定气泡上的字用深色还是白色
  const m=/^#?([0-9a-f]{6})$/i.exec(hex);if(!m)return'#fff';
  const n=parseInt(m[1],16),r=n>>16,g=n>>8&255,b=n&255;
  return (r*.299+g*.587+b*.114)>150?'#3d3a35':'#fff';
}
function applyDecor(){
  const rs=document.documentElement.style;
  const bg=BGS[decor.bg]!==undefined?BGS[decor.bg]:decor.bg; // 自定义色直接存色值
  rs.setProperty('--chat-bg',bg||'linear-gradient(180deg,var(--bg),var(--bg2))');
  rs.setProperty('--my-bub',decor.myBub);
  rs.setProperty('--my-bub-text',textOn(decor.myBub));
  if(decor.hisBub==='default'){rs.setProperty('--his-bub','var(--card)');rs.setProperty('--his-bub-text','var(--text)');rs.setProperty('--his-bub-border','var(--border)');}
  else{rs.setProperty('--his-bub',decor.hisBub);rs.setProperty('--his-bub-text',textOn(decor.hisBub));rs.setProperty('--his-bub-border','transparent');}
  document.body.classList.toggle('hide-os',!decor.showOS);
  document.querySelectorAll('.avatar.assistant').forEach(el=>setAvatar(el,'assistant'));
  document.querySelectorAll('.avatar.user').forEach(el=>setAvatar(el,'user'));
  setAvatar(document.getElementById('callAvatar'),'assistant');
}
function setAvatar(el,role){
  const v=role==='user'?decor.myAv:decor.kAv;
  if(v.startsWith('img:')){el.style.backgroundImage="url('"+v.slice(4)+"')";el.textContent='';}
  else{el.style.backgroundImage='';el.textContent=v.replace(/^emoji:/,'');}
}
function buildDrawer(){
  const mk=(row,items,cur,fn,render)=>{
    row.innerHTML='';
    for(const it of items){
      const d=document.createElement('div');d.className='sw';render(d,it);
      if(it===cur)d.classList.add('on');
      d.onclick=()=>{fn(it);buildDrawer();};
      row.appendChild(d);
    }
  };
  mk(document.getElementById('bgRow'),Object.keys(BGS),decor.bg,v=>{decor.bg=v;saveDecor();applyDecor();},
    (d,v)=>{d.style.background=BGS[v]||'linear-gradient(180deg,#f8f3ec,#f2eae0)';d.title=v;});
  // 背景自定义色
  addCustom(document.getElementById('bgRow'),decor.bg,v=>{decor.bg=v;saveDecor();applyDecor();buildDrawer();});
  mk(document.getElementById('myBubRow'),MY_BUBS,decor.myBub,v=>{decor.myBub=v;saveDecor();applyDecor();},
    (d,v)=>{d.style.background=v;});
  addCustom(document.getElementById('myBubRow'),decor.myBub,v=>{decor.myBub=v;saveDecor();applyDecor();buildDrawer();});
  mk(document.getElementById('hisBubRow'),HIS_BUBS,decor.hisBub,v=>{decor.hisBub=v;saveDecor();applyDecor();},
    (d,v)=>{if(v==='default'){d.style.background='var(--card)';d.title='跟随主题';}else d.style.background=v;});
  buildAvGrid(document.getElementById('kAvGrid'),'kAv');
  buildAvGrid(document.getElementById('myAvGrid'),'myAv');
  document.getElementById('tgVoice').checked=decor.voiceBar;
  document.getElementById('tgOS').checked=decor.showOS;
  document.getElementById('tgFinger').checked=decor.fingertips;
}
function addCustom(row,cur,fn){
  const d=document.createElement('div');d.className='sw custom';d.textContent='🎨';
  const i=document.createElement('input');i.type='color';
  if(/^#[0-9a-f]{6}$/i.test(cur))i.value=cur;
  i.oninput=()=>fn(i.value);
  d.appendChild(i);row.appendChild(d);
}
function buildAvGrid(grid,key){
  grid.innerHTML='';
  const cur=decor[key];
  const add=(val,render)=>{
    const d=document.createElement('div');d.className='av';render(d);
    if(val===cur)d.classList.add('on');
    d.onclick=()=>{decor[key]=val;saveDecor();applyDecor();buildDrawer();};
    grid.appendChild(d);
  };
  for(const e of EMOJI_AVS)add('emoji:'+e,d=>d.textContent=e);
  for(const name in stickerMap)add('img:'+stickerMap[name],d=>{d.style.backgroundImage="url('"+stickerMap[name]+"')";d.title=name;});
}
function toggleDrawer(){
  const show=!document.getElementById('drawer').classList.contains('show');
  document.getElementById('drawer').classList.toggle('show',show);
  document.getElementById('drawerMask').classList.toggle('show',show);
  if(show)buildDrawer();
}
document.getElementById('tgVoice').onchange=e=>{decor.voiceBar=e.target.checked;saveDecor();};
document.getElementById('tgOS').onchange=e=>{decor.showOS=e.target.checked;saveDecor();applyDecor();};
document.getElementById('tgFinger').onchange=e=>{decor.fingertips=e.target.checked;saveDecor();};

// ═══ 心潮面板: 他的心 ═══════════════════════════════════
// 数据来自 /api/mood(脱敏投影): 十二维驱动力、疲惫、念头计数、梦的元信息。
// 梦的正文不在数据里 —— 那是他自己的。
function toggleMood(){
  const show=!document.getElementById('moodDrawer').classList.contains('show');
  document.getElementById('moodDrawer').classList.toggle('show',show);
  document.getElementById('moodMask').classList.toggle('show',show);
  if(show)loadMood();
}
async function loadMood(){
  const body=document.getElementById('moodBody');
  body.innerHTML='<div class="mood-loading">正在摸他的心…</div>';
  try{
    const d=await fetch('/api/mood').then(r=>r.json());
    if(!d.ok){body.innerHTML='<div class="mood-loading">没摸到——'+(d.reason||'心潮不在线')+'</div>';return;}
    renderMood(d);
  }catch(e){body.innerHTML='<div class="mood-loading">连接不上,稍后再试</div>';}
}
function shortLabel(s){return String(s||'').split(/[、,,]/)[0].slice(0,6)}
function fmtIdle(min){
  if(min==null)return'';
  if(min<60)return'你离开 '+min+' 分钟了';
  if(min<1440)return'你离开 '+Math.floor(min/60)+' 小时了';
  return'你离开 '+Math.floor(min/1440)+' 天了';
}
function petalSVG(drives){
  const C=160,R=104,n=drives.length||12;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[(C+r*Math.cos(a)).toFixed(1),(C+r*Math.sin(a)).toFixed(1)]};
  let s='<svg viewBox="0 0 320 320">';
  for(const g of[.25,.5,.75,1])s+='<circle class="pl-grid" cx="'+C+'" cy="'+C+'" r="'+(R*g).toFixed(1)+'"/>';
  for(let i=0;i<n;i++){const[x,y]=pt(i,R);s+='<line class="pl-axis" x1="'+C+'" y1="'+C+'" x2="'+x+'" y2="'+y+'"/>';}
  const pts=drives.map((d,i)=>pt(i,10+Math.max(0,Math.min(1,d.value))*(R-10)));
  s+='<polygon class="pl-shape" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>';
  pts.forEach(p=>{s+='<circle class="pl-dot" cx="'+p[0]+'" cy="'+p[1]+'" r="2.6"/>';});
  drives.forEach((d,i)=>{
    const[a,b]=pt(i,R+13);
    const anchor=Math.abs(a-C)<20?'middle':(a>C?'start':'end');
    s+='<text class="pl-label'+(d.value>=.5?' hot':'')+'" x="'+a+'" y="'+b+'" text-anchor="'+anchor+'" dominant-baseline="middle">'+shortLabel(d.label)+'</text>';
  });
  return s+'</svg>';
}
function renderMood(d){
  const sleep=String(d.consciousness||'').includes('sleep')||d.consciousness==='asleep';
  const state=sleep?'😴 睡着了':(d.consciousness==='awake'?'🌤 醒着':'❔ '+(d.consciousness||'未知'));
  const fatPct=Math.round(Math.max(0,Math.min(1,(d.fatigue||0)/0.3))*100);
  let h='<div class="mood-state"><b>'+state+'</b><span>'+fmtIdle(d.idleMinutes)+'</span></div>';
  h+='<div class="fat-row">疲惫 '+fatPct+'%<div class="fat-bar"><i style="width:'+fatPct+'%"></i></div></div>';
  h+='<div class="petal-wrap">'+petalSVG(d.drives||[])+'</div>';
  const top=(d.topDrives||[]).slice(0,4);
  if(top.length){
    h+='<h3>此刻最强的心思</h3><div class="top-drives">';
    for(const t of top)h+='<div class="td-row"><span class="n">'+t.label+'</span><span class="bar"><i style="width:'+(t.percent||Math.round(t.value*100))+'%"></i></span><span class="v">'+(t.percent||Math.round(t.value*100))+'%</span></div>';
    h+='</div>';
  }
  const th=d.thoughts||{};
  h+='<h3>念头</h3><div class="mood-dreams">闪念 '+(th.flashCount||0)+' 个 · 执念 '+(th.obsessionCount||0)+' 个</div>';
  h+='<h3>最近的梦</h3><div class="mood-dreams">';
  if((d.dreams||[]).length){
    for(const dr of d.dreams){
      const t=dr.at?new Date(dr.at):null;
      const when=t?fmtTime(t.getTime()):'';
      const lu=dr.lucidity!=null?'●'.repeat(Math.max(1,Math.round(dr.lucidity*5)))+'○'.repeat(5-Math.max(1,Math.round(dr.lucidity*5))):'';
      h+='<div class="d"><span>💭 '+when+' 做了一个梦</span><span class="lu" title="清明度">'+lu+'</span></div>';
    }
    h+='<div style="opacity:.65;font-size:11.5px">梦的内容只属于他;想听就当面问他。</div>';
  }else h+='还没做过梦。';
  h+='</div><div class="mood-foot"><button onclick="loadMood()">↻ 再摸一下</button></div>';
  document.getElementById('moodBody').innerHTML=h;
}

// ═══ 表情包 ═══════════════════════════════════════════
let stickerMap={};
function renderContent(el,content){
  content=String(content==null?'':content);
  el.textContent='';
  const parts=content.split(/\[sticker:([^\]]+)\]/);
  for(let i=0;i<parts.length;i++){
    if(i%2){ // 奇数段是表情名
      const name=parts[i].trim(),url=stickerMap[name];
      if(url){const img=document.createElement('img');img.src=url;img.alt=name;img.className='sticker';el.appendChild(img);}
      else el.appendChild(document.createTextNode('['+parts[i]+']'));
    }else if(parts[i])el.appendChild(document.createTextNode(parts[i]));
  }
}
function buildStickerPanel(){
  const p=document.getElementById('stkpanel');p.innerHTML='';
  for(const name in stickerMap){
    const img=document.createElement('img');
    img.src=stickerMap[name];img.title=name;img.loading='lazy';
    img.onclick=()=>sendSticker(name);
    p.appendChild(img);
  }
}
function toggleStickers(){document.getElementById('stkpanel').classList.toggle('show')}

// ═══ 时间戳 (微信式: 隔 10 分钟以上才出现一条) ═══════════
let lastTs=0;
function fmtTime(ts){
  const d=new Date(ts),now=new Date();
  const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const day0=t=>new Date(t.getFullYear(),t.getMonth(),t.getDate()).getTime();
  const diff=(day0(now)-day0(d))/864e5;
  if(diff===0)return hm;
  if(diff===1)return'昨天 '+hm;
  if(diff<7)return'周'+'日一二三四五六'[d.getDay()]+' '+hm;
  return (d.getFullYear()!==now.getFullYear()?d.getFullYear()+'年':'')+(d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
function maybeDivider(ts){
  if(!ts)ts=Date.now();
  if(ts-lastTs>10*60e3){
    const d=document.createElement('div');d.className='divider';d.textContent=fmtTime(ts);
    document.getElementById('msgs').appendChild(d);
  }
  lastTs=ts;
}

// ═══ 消息 DOM ═══════════════════════════════════════════
function addRow(role,ts){
  maybeDivider(ts);
  const row=document.createElement('div');row.className='row '+role;
  const av=document.createElement('div');av.className='avatar '+role;setAvatar(av,role);
  const wrap=document.createElement('div');wrap.className='bwrap';
  const bub=document.createElement('div');bub.className='bubble '+role;
  wrap.appendChild(bub);row.appendChild(av);row.appendChild(wrap);
  document.getElementById('msgs').appendChild(row);
  bub.scrollIntoView({behavior:'smooth'});
  return {row,bub,wrap};
}
// 内心OS: 摘出 [os:...] 那句没说出口的
// 模型偶尔不把它放最末尾(比如表情包压轴),所以全文找,取最后一处显示
function splitOS(content){
  content=String(content==null?'':content);
  let os='';
  const ms=[...content.matchAll(/\[os:([\s\S]*?)\]/g)];
  if(ms.length)os=ms[ms.length-1][1].trim();
  const cleaned=content.replace(/\[os:[\s\S]*?\]/g,'').replace(/\n{3,}/g,'\n\n').trim();
  return {text:cleaned,os};
}
function fillAssistant(parts,content){
  const {text,os}=splitOS(content);
  const bub=parts.bub;bub.innerHTML='';
  const stickerOnly=/^\s*\[sticker:[^\]]+\]\s*$/.test(text);
  bub.classList.toggle('sticker-only',stickerOnly);
  const speech=stickerOnly?'':text.replace(/\[sticker:[^\]]+\]/g,' ').trim();
  if(decor.voiceBar&&speech){
    const vb=document.createElement('div');vb.className='vbar';
    vb.innerHTML='<span class="vp">▶</span><span class="waves"><i></i><i></i><i></i><i></i><i></i></span><span class="vdur">'+estDur(speech)+'"</span>';
    vb.onclick=()=>playVoice(vb,speech);
    bub.appendChild(vb);
  }
  const t=document.createElement('div');renderContent(t,text);bub.appendChild(t);
  if(os){
    const o=document.createElement('div');o.className='os';
    const s=document.createElement('span');s.className='os-text';s.textContent=os;
    o.appendChild(s);o.onclick=()=>o.classList.toggle('collapsed');
    bub.appendChild(o);
  }
  // 译: 他说英文,点一下展开中文
  if(speech&&/[a-zA-Z]{2}/.test(speech)){
    const meta=document.createElement('div');meta.className='meta';
    const btn=document.createElement('span');btn.className='tbtn';btn.textContent='译';
    const out=document.createElement('div');out.className='tout';
    btn.onclick=()=>toggleTrans(btn,out,speech,os);
    meta.appendChild(btn);parts.wrap.appendChild(meta);parts.wrap.appendChild(out);
  }
}
let transBusy=!1;
async function toggleTrans(btn,out,text,os){
  if(out.dataset.done){out.classList.toggle('show');return;}
  if(transBusy)return;transBusy=!0;btn.textContent='…';
  try{
    const payload=text+(os?'\n(unspoken) '+os:'');
    const d=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:payload})}).then(r=>r.json());
    if(d.zh){out.textContent=d.zh;out.dataset.done='1';out.classList.add('show');}
    else btn.textContent='译';
  }catch(e){btn.textContent='译';}
  if(out.dataset.done)btn.textContent='译';
  transBusy=!1;
}

// ═══ 语音条播放 (他的声音,复用 /api/tts) ═══════════════
function estDur(t){ // 微信式时长标注:按语速估,不用真合成完才知道
  const en=(t.match(/[a-zA-Z'’-]+/g)||[]).length,zh=(t.match(/[一-鿿]/g)||[]).length;
  return Math.min(60,Math.max(1,Math.round(en/2.6+zh/3.8)));
}
let curVoice=null;
async function playVoice(el,text){
  if(curVoice){const same=curVoice.el===el;curVoice.stop();curVoice=null;if(same)return;}
  const chunks=splitForTTS(text);
  let stopped=!1,audio=null;
  curVoice={el,stop(){stopped=!0;if(audio)try{audio.pause()}catch(e){};el.classList.remove('playing');el.querySelector('.vp').textContent='▶';}};
  el.classList.add('playing');el.querySelector('.vp').textContent='⏸';
  for(const c of chunks){
    if(stopped)break;
    const blob=await fetchTTSBlob(c);
    if(stopped)break;
    if(!blob)continue;
    await new Promise(res=>{
      audio=new Audio(URL.createObjectURL(blob));
      audio.onended=res;audio.onerror=res;
      audio.play().catch(res);
    });
  }
  if(curVoice&&curVoice.el===el){curVoice=null;el.classList.remove('playing');el.querySelector('.vp').textContent='▶';}
}
async function fetchTTSBlob(text){
  try{
    const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,persona})});
    if(!r.ok)return null;
    return await r.blob();
  }catch(e){return null}
}

// ═══ fingertips · 指尖 ═══════════════════════════════════
// 打字时每 4 秒给后端一个空 ping —— 只上报"正在打字"这个事实,不携带任何内容。
let _lastPing=0;
document.getElementById('inp').addEventListener('input',()=>{
  if(!decor.fingertips)return;
  const now=Date.now();
  if(now-_lastPing<4000)return;
  if(!document.getElementById('inp').value.trim())return;
  _lastPing=now;
  fetch('/api/typing/ping',{method:'POST',keepalive:!0}).catch(()=>{});
});

// ═══ 打开时回到最近的会话并加载记录 ═══════════════════════
(async()=>{
  try{
    const l=await fetch('/api/stickers').then(r=>r.json());
    if(Array.isArray(l))for(const s of l)stickerMap[s.name]=s.url;
    buildStickerPanel();
  }catch(e){}
  applyDecor();
  try{
    const list=await fetch('/api/sessions').then(r=>r.json());
    if(Array.isArray(list)&&list.length){
      sessionId=list[0].id;
      const msgs=await fetch('/api/messages/'+sessionId).then(r=>r.json());
      if(Array.isArray(msgs)&&msgs.length){
        document.getElementById('welcome').style.display='none';
        let lastEl=null;
        for(const m of msgs){
          const ts=m.created_at?new Date(m.created_at).getTime():Date.now();
          const parts=addRow(m.role==='user'?'user':'assistant',ts);
          if(m.role==='user'){
            parts.bub.classList.toggle('sticker-only',/^\s*\[sticker:[^\]]+\]\s*$/.test(String(m.content||'').trim()));
            renderContent(parts.bub,m.content);
          }
          else fillAssistant(parts,m.content);
          lastEl=parts.row;
        }
        if(lastEl)lastEl.scrollIntoView();
        return;
      }
      return;
    }
  }catch(e){}
  try{
    const d=await fetch('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'我们的家'})}).then(r=>r.json());
    if(d.id)sessionId=d.id;
  }catch(e){}
})();

async function send(){
  const inp=document.getElementById('inp'),text=inp.value.trim();
  if(!text||loading)return;inp.value='';
  await postMessage(text);
}
async function sendSticker(name){
  if(loading)return;
  document.getElementById('stkpanel').classList.remove('show');
  await postMessage('[sticker:'+name+']');
}
async function postMessage(text){
  if(loading)return;loading=!0;
  document.getElementById('welcome').style.display='none';
  const u=addRow('user');
  u.bub.classList.toggle('sticker-only',/^\s*\[sticker:[^\]]+\]\s*$/.test(text));
  renderContent(u.bub,text);
  const parts=addRow('assistant');
  parts.bub.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,message:text,persona})});
    const d=await r.json();
    fillAssistant(parts,d.reply||'(空)');
    if(callOpen)speakAsync(d.reply);
  }catch(e){parts.bub.textContent='连接中断——稍等再试';}
  loading=!1;
}

// ═══ 按住说话 (复用通话那套识别,微信式交互) ═══════════════
let voiceMode=!1;
function toggleVoiceMode(){
  voiceMode=!voiceMode;
  document.getElementById('inp').style.display=voiceMode?'none':'';
  document.getElementById('talkBtn').style.display=voiceMode?'':'none';
  document.getElementById('sendbtn').style.display=voiceMode?'none':'';
  document.getElementById('modeBtn').textContent=voiceMode?'⌨️':'🎤';
}
let holdRec=null,holdFinal='',holdInterim='',holding=!1,holdCancel=!1,holdDone=!1,holdStartY=0;
const talkBtn=document.getElementById('talkBtn');
talkBtn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(loading||holding)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){document.getElementById('holdText').textContent='此浏览器不支持语音识别';return;}
  holding=!0;holdCancel=!1;holdDone=!1;holdFinal='';holdInterim='';holdStartY=e.clientY;
  talkBtn.classList.add('holding');talkBtn.textContent='松开 发送';
  document.getElementById('holdOverlay').classList.add('show');
  document.getElementById('holdOverlay').classList.remove('cancel');
  document.getElementById('holdText').textContent='我在听…';
  document.getElementById('holdHint').textContent='松开发送 · 上滑取消';
  try{talkBtn.setPointerCapture(e.pointerId)}catch(err){}
  holdRec=new SR();holdRec.lang='zh-CN';holdRec.interimResults=!0;holdRec.continuous=!0;
  holdRec.onresult=ev=>{
    holdInterim='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const t=(ev.results[i][0]?.transcript||'').trim();
      if(ev.results[i].isFinal)holdFinal+=t;else holdInterim+=t;
    }
    const all=(holdFinal+holdInterim).trim();
    if(all)document.getElementById('holdText').textContent=all;
  };
  holdRec.onend=()=>{
    if(holding){try{holdRec.start()}catch(err){}}
    else finishHold();
  };
  holdRec.onerror=ev=>{
    if(ev.error==='not-allowed'){document.getElementById('holdText').textContent='麦克风未授权';holding=!1;setTimeout(finishHold,800);}
  };
  try{holdRec.start()}catch(err){}
});
talkBtn.addEventListener('pointermove',e=>{
  if(!holding)return;
  const up=holdStartY-e.clientY>80;
  if(up!==holdCancel){
    holdCancel=up;
    document.getElementById('holdOverlay').classList.toggle('cancel',up);
    document.getElementById('holdHint').textContent=up?'松开手指,取消发送':'松开发送 · 上滑取消';
  }
});
function endHold(){
  if(!holding)return;
  holding=!1;
  talkBtn.classList.remove('holding');talkBtn.textContent='按住 说话';
  let ended=!1;
  if(holdRec)try{holdRec.stop();ended=!0}catch(err){}
  if(!ended)finishHold();
  setTimeout(finishHold,1500); // 识别器 onend 偶尔不来,兜底收尾
}
talkBtn.addEventListener('pointerup',endHold);
talkBtn.addEventListener('pointercancel',()=>{holdCancel=!0;endHold();});
function finishHold(){
  if(holdDone)return;holdDone=!0;
  document.getElementById('holdOverlay').classList.remove('show');
  const text=(holdFinal+holdInterim).trim();
  holdRec=null;
  if(!holdCancel&&text)postMessage(text);
}

// ═══ Voice Call ═══════════════════════════════════════
async function toggleCall(){
  const overlay=document.getElementById('callOverlay'),btn=document.getElementById('callBtn');
  callOpen=!callOpen;

  if(callOpen){
    overlay.classList.add('show');btn.classList.add('active');
    document.getElementById('callTimer').textContent='00:00';
    document.getElementById('callSubtitle').textContent='正在接通…';
    document.getElementById('callTranscript').textContent='';
    document.getElementById('callMicError').textContent='';
    document.getElementById('callPermBtn').style.display='none';
    document.getElementById('callRecording').classList.remove('show');
    callTimer=0;callInterval=setInterval(()=>{callTimer++;const m=Math.floor(callTimer/60),s=callTimer%60;document.getElementById('callTimer').textContent=(m<10?'0'+m:m)+':'+(s<10?'0'+s:s)},1000);
    fetch('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start',session_id:sessionId})}).catch(()=>{});

    // Unlock AudioContext immediately (user gesture)
    if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
    if(audioCtx.state==='suspended'){await audioCtx.resume();}
    startRing();
    requestMicAndStart(); // 直接接通;浏览器记住授权后无需再点按钮
  } else {
    overlay.classList.remove('show');btn.classList.remove('active');
    clearInterval(callInterval);stopSTT();stopRing();speakQueue=[];
    fetch('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'end',session_id:sessionId})}).catch(()=>{});
  }
}

// ═══ 拨号音 (嘟——) ═══════════════════════════════
let ringInt=null;
function ringBeep(){
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=425;g.gain.value=.06;
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+1);
  }catch(e){}
}
function startRing(){stopRing();if(!audioCtx)return;ringBeep();ringInt=setInterval(ringBeep,4000)}
function stopRing(){if(ringInt){clearInterval(ringInt);ringInt=null}}

let ttsAudio = null;
let callAudioCtx = null;
async function requestMicAndStart(){
  document.getElementById('callMicError').textContent='';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:!0});
    stream.getTracks().forEach(t=>t.stop());
    if(!callOpen)return; // 等待授权期间已挂断

    // init & keep a living AudioContext — unlocked by user gesture
    if(!callAudioCtx) callAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(callAudioCtx.state==='suspended') await callAudioCtx.resume();

    stopRing();
    document.getElementById('callPermBtn').style.display='none';
    document.getElementById('callSubtitle').textContent='接通了。说话吧。';
    startSTT();
  }catch(e){
    stopRing();
    if(!callOpen)return;
    document.getElementById('callPermBtn').style.display='block';
    document.getElementById('callMicError').textContent='麦克风未授权。点击上方按钮,并在浏览器弹窗里选择"允许"。';
    document.getElementById('callSubtitle').textContent='需要麦克风权限';
  }
}

// ═══ Speech Recognition (STT) ═════════════════════════
function startSTT(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    document.getElementById('callMicError').textContent='此浏览器不支持语音识别。请使用Chrome或Safari。';
    return;
  }
  recognitionWanted=!0;
  recognition=new SpeechRecognition();
  recognition.lang='zh-CN';
  recognition.interimResults=!0;
  recognition.continuous=!0;

  recognition.onresult=event=>{
    let interim='';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const piece=(event.results[i][0]?.transcript||'').trim();
      if(event.results[i].isFinal){
        document.getElementById('callTranscript').textContent=piece;
        document.getElementById('callSubtitle').textContent='...';
        sendVoiceText(piece);
      }else{interim+=piece}
    }
    if(interim)document.getElementById('callTranscript').textContent=interim;
  };

  recognition.onstart=()=>{
    document.getElementById('callRecording').classList.add('show');
    document.getElementById('callSubtitle').textContent='正在听…';
  };

  recognition.onend=()=>{
    // 唯一的重启入口(出错后 onend 也会触发,交给这里统一重启,避免双重 start)
    if(callOpen&&recognitionWanted)setTimeout(()=>{try{recognition.start()}catch(e){}},300);
  };

  recognition.onerror=e=>{
    if(e.error==='not-allowed'){document.getElementById('callMicError').textContent='麦克风被拒绝。';stopSTT();return;}
  };

  recognition.start();
}

function stopSTT(){
  recognitionWanted=!1;
  if(recognition){try{recognition.stop()}catch(e){}}
  document.getElementById('callRecording').classList.remove('show');
  document.getElementById('callTranscript').textContent='';
}

let lastVoiceText='',lastVoiceAt=0;
async function sendVoiceText(text){
  if(!text||text.length<2)return;
  // 识别器(尤其 iOS)偶尔把同一句 final 报两遍 —— 短时间内一模一样的话只发一次
  const now=Date.now();
  if(text===lastVoiceText&&now-lastVoiceAt<6000)return;
  lastVoiceText=text;lastVoiceAt=now;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,message:text,persona})});
    const d=await r.json();
    const reply=d.reply||'';
    if(reply)speakAsync(reply);
  }catch(e){}
}

// ═══ Audio Playback (TTS + Web Audio) ═══════════════
// 长回复按句切段、流水线合成:第一句很快开口,边放边取下一段,再长也说得完
function splitForTTS(text){
  // 中文标点直接断句;英文 .!? 需后跟空格才断(避免切碎小数/缩写)
  const parts=text.replace(/\s+/g,' ').split(/(?<=[。!?;…!?;])|(?<=[.!?])\s+/);
  const chunks=[];let cur='';
  for(const p of parts){
    if(!p)continue;
    if(cur&&(cur+p).length>120){chunks.push(cur);cur=p}else cur+=(cur?' ':'')+p;
  }
  if(cur.trim())chunks.push(cur);
  // 单段超长(无标点的极端情况)强制切开,防止服务端截断丢音
  const out=[];
  for(let c of chunks.map(s=>s.trim()).filter(Boolean)){
    while(c.length>160){out.push(c.slice(0,120));c=c.slice(120)}
    if(c)out.push(c);
  }
  return out;
}

async function fetchTTS(text){
  try{
    const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,persona})});
    if(!r.ok)return null;
    return await r.arrayBuffer();
  }catch(e){return null}
}

async function playBuf(arrayBuf){
  if(!callAudioCtx||!arrayBuf)return;
  if(callAudioCtx.state==='suspended')await callAudioCtx.resume();
  const audioBuf=await callAudioCtx.decodeAudioData(arrayBuf);
  const src=callAudioCtx.createBufferSource();
  src.buffer=audioBuf;src.connect(callAudioCtx.destination);src.start(0);
  await new Promise(r=>{src.onended=r});
}

// 中文字幕: 他说英文,字幕显示中文(翻译与语音并行,译文到了就替换字幕)
let zhLock=!1;
function showZhSubtitle(text){
  zhLock=!1;
  if(!/[a-zA-Z]{2}/.test(text))return; // 本来就是中文就不用翻
  fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})})
    .then(r=>r.json())
    .then(d=>{if(d.zh&&callOpen){zhLock=!0;document.getElementById('callSubtitle').textContent=d.zh}})
    .catch(()=>{});
}

async function speakAsync(text){
  // 表情包暗号和心声 [os:...] 不朗读、不进字幕
  text=String(text||'').replace(/\[sticker:[^\]]+\]/g,' ').replace(/\[os:[\s\S]*?\]/g,' ').trim();
  if(!text)return;
  speakQueue=splitForTTS(text);
  showZhSubtitle(text);
  if(speaking)return;
  speaking=!0;
  try{
    let idx=0,nextBuf=speakQueue.length?fetchTTS(speakQueue[0]):null;
    while(idx<speakQueue.length&&callOpen){
      const chunk=speakQueue[idx],buf=await nextBuf;
      idx++;
      nextBuf=idx<speakQueue.length?fetchTTS(speakQueue[idx]):null; // 预取下一段
      if(!buf)continue;
      if(!zhLock)document.getElementById('callSubtitle').textContent=chunk;
      await playBuf(buf);
    }
  }catch(e){}
  speaking=!1;
}
