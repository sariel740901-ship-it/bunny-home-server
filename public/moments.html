<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>动态</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f5;--bg2:#f5f3ec;--card:#ffffff;--text:#3d3929;--muted:#8b887c;--border:#e7e5da;
  --accent:#d97757;--chip:#f0eee5;
  --serif:'Lora',Georgia,'Songti SC','Noto Serif SC',serif;
  --shadow:0 1px 2px rgba(61,57,41,.04),0 3px 10px rgba(61,57,41,.05);
  --topbar:rgba(250,249,245,.9)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#262624;--bg2:#21201e;--card:#30302e;--text:#eceae2;--muted:#a3a094;--border:#3e3d38;
  --chip:#3a3936;--topbar:rgba(38,38,36,.9);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 3px 10px rgba(0,0,0,.25)
}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','MiSans',BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:5;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 16px;text-align:center}
.topbar h1{font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:.4px}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 8px}

/* 发布框 */
.composer{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:12px;margin-bottom:16px}
.composer textarea{width:100%;border:none;background:transparent;color:var(--text);font-size:14.5px;font-family:inherit;resize:none;outline:none;line-height:1.7;min-height:44px}
.composer textarea::placeholder{color:var(--muted)}
.cimgs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.cimgs .ci{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.cimgs .ci img{width:100%;height:100%;object-fit:cover}
.cimgs .ci button{position:absolute;top:2px;right:2px;width:20px;height:20px;border:none;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;cursor:pointer;line-height:1}
.crow{display:flex;align-items:center;gap:8px;margin-top:6px}
.crow .sp{flex:1}
.pill{padding:7px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
.pill:active{transform:scale(.96)}
.pill.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.pill:disabled{opacity:.5}

/* 动态卡片 */
.mcard{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mav{width:38px;height:38px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:21px;background-size:cover;background-position:center;flex-shrink:0;border:1px solid var(--border)}
.mname{font-size:14px;font-weight:500}
.mtime{font-size:11.5px;color:var(--muted);margin-top:2px}
.mtext{font-size:14.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.mcard.him .mtext{font-family:var(--serif)}
.mimgs{display:grid;gap:6px;margin-top:8px}
.mimgs.n1{grid-template-columns:minmax(0,72%)}
.mimgs.n2{grid-template-columns:1fr 1fr}
.mimgs.n3{grid-template-columns:1fr 1fr 1fr}
.mimgs img{width:100%;border-radius:10px;display:block;cursor:pointer;aspect-ratio:1;object-fit:cover}
.mimgs.n1 img{aspect-ratio:auto;max-height:340px;object-fit:contain;background:var(--bg2)}
.mact{display:flex;align-items:center;gap:14px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)}
.mbtn{border:none;background:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;padding:2px 4px}
.mbtn.liked{color:var(--accent)}
.mlikes{font-size:12.5px;color:var(--muted)}
.mlikes .hh{color:var(--accent)}
.cmts{margin-top:8px;background:var(--bg2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.cmt{font-size:13px;line-height:1.65;word-break:break-word}
.cmt b{font-weight:600}
.cmt.him{font-family:var(--serif)}
.cmtrow{display:flex;gap:8px;margin-top:8px}
.cmtrow input{flex:1;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none}
.cmtrow input:focus{border-color:var(--accent)}
.more{display:block;margin:6px auto 20px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;padding:8px}
.emptyf{text-align:center;color:var(--muted);font-size:14px;font-family:var(--serif);font-style:italic;padding:60px 0}
.hintline{text-align:center;font-size:11.5px;color:var(--muted);padding:4px 0 14px}

.hide{display:none !important}
/* 图片全屏查看 */
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;align-items:center;justify-content:center}
.viewer.show{display:flex}
.viewer img{max-width:96vw;max-height:92vh;border-radius:6px}

/* 底部 tab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:10.5px;letter-spacing:.5px;position:relative}
.tabbar a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--accent)}
.tabbar a .dot{position:absolute;top:-1px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:#e0524d;display:none}
.tabbar a .dot.show{display:block}
</style>
</head>
<body>
<header class="topbar"><h1>动态</h1></header>
<div class="wrap">
  <div class="composer">
    <textarea id="ptext" rows="2" placeholder="这一刻的想法…"></textarea>
    <div class="cimgs" id="pimgs"></div>
    <div class="crow">
      <button class="pill" onclick="document.getElementById('pimg').click()">图片</button>
      <input type="file" id="pimg" accept="image/*" multiple style="display:none">
      <span class="sp"></span>
      <button class="pill accent" id="postBtn" onclick="post()">发布</button>
    </div>
  </div>
  <div id="feed"><div class="emptyf">还没有动态,发第一条吧</div></div>
  <button class="more hide" id="moreBtn" onclick="loadMore()">看更早的</button>
  <div class="hintline">他会自己刷到 —— 点赞和回评不一定马上来,像真的朋友圈一样</div>
</div>
<div class="viewer" id="viewer" onclick="this.classList.remove('show')"><img id="viewerImg"></div>

<nav class="tabbar">
  <a href="/"><svg viewBox="0 0 24 24"><path d="M21 7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h1v4l5-4h8a2 2 0 0 0 2-2z"/></svg>消息</a>
  <a class="on" href="/moments.html"><svg viewBox="0 0 24 24"><path d="M12 21v-8"/><path d="M12 13c0-4 3-6.5 7.5-6.5 0 4.5-3 6.5-7.5 6.5z"/><path d="M12 13c0-3-2.2-5-5.8-5 0 3.4 2.2 5 5.8 5z"/></svg>动态</a>
  <a href="/house.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V19h12V9.5"/><path d="M10 19v-5h4v5"/></svg>小屋</a>
  <a href="/games.html"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="9" rx="4.5"/><path d="M8 10.8v3.4M6.3 12.5h3.4"/><path d="M15.6 11.3h.01M18 13.6h.01"/></svg>游戏</a>
</nav>

<script>
// ═══ 门禁钥匙(和聊天页同一把) ═══
const BUNNY_KEY_LS='bunny_api_key';
(function(){
  const orig=window.fetch.bind(window);
  const withKey=(opts,k)=>{opts=Object.assign({},opts);opts.headers=Object.assign({},opts.headers,k?{'x-api-key':k}:{});return opts};
  window.fetch=async function(url,opts){
    if(typeof url!=='string'||!url.startsWith('/api'))return orig(url,opts);
    let k=localStorage.getItem(BUNNY_KEY_LS)||'';
    let r=await orig(url,withKey(opts,k));
    while(r.status===401){
      const input=prompt('这扇门上了锁 — 输入家里的钥匙 (BUNNY_API_KEY)');
      if(input===null)break;
      k=input.trim();localStorage.setItem(BUNNY_KEY_LS,k);
      r=await orig(url,withKey(opts,k));
    }
    return r;
  };
})();

// 头像沿用聊天页的装扮
let decor={};try{decor=JSON.parse(localStorage.getItem('bunny_decor_v1')||'{}')}catch(e){}
function avatarStyle(author){
  // 聊天页的装扮存的是 img:<dataURL> 前缀格式,两种都认
  const s=String((author==='him'?decor.kAv:decor.myAv)||'');
  if(s.startsWith('img:'))return{img:s.slice(4)};
  if(s.startsWith('data:'))return{img:s};
  return{emoji:author==='him'?'🐰':'🌸'};
}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function ftime(t){
  const d=new Date(t),now=Date.now(),diff=(now-d.getTime())/6e4;
  if(diff<1)return'刚刚';
  if(diff<60)return Math.floor(diff)+'分钟前';
  if(diff<60*24)return Math.floor(diff/60)+'小时前';
  const pad=n=>String(n).padStart(2,'0');
  return(d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes());
}

// ═══ 信息流 ═══
let oldest=0,moments=[];
async function load(initial){
  const r=await fetch('/api/moments?limit=20'+(initial?'':'&before='+oldest));
  if(!r.ok)return;
  const d=await r.json();
  const list=d.moments||[];
  if(initial)moments=list;else moments=moments.concat(list);
  if(list.length)oldest=list[list.length-1].id;
  document.getElementById('moreBtn').classList.toggle('hide',list.length<20);
  render();
  if(initial&&moments.length)localStorage.setItem('bunny_moments_seen',String(moments[0].id));
}
function loadMore(){load(false)}
function render(){
  const feed=document.getElementById('feed');
  if(!moments.length){feed.innerHTML='<div class="emptyf">还没有动态,发第一条吧</div>';return}
  feed.innerHTML='';
  for(const m of moments)feed.appendChild(card(m));
}
function card(m){
  const el=document.createElement('div');
  el.className='mcard'+(m.author==='him'?' him':'');
  const av=avatarStyle(m.author);
  const likes=Array.isArray(m.likes)?m.likes:[];
  const likeTxt=likes.length?('❤ '+likes.map(x=>x==='him'?'小克':'嘉嘉').join('、')):'';
  const imgs=Array.isArray(m.images)?m.images:[];
  el.innerHTML=
    '<div class="mhead"><div class="mav"'+(av.img?' style="background-image:url('+av.img+')"':'')+'>'+(av.img?'':av.emoji)+'</div>'
    +'<div><div class="mname">'+(m.author==='him'?'小克':'嘉嘉')+'</div><div class="mtime">'+ftime(m.created_at)+'</div></div></div>'
    +(m.content?'<div class="mtext">'+esc(m.content)+'</div>':'')
    +(imgs.length?'<div class="mimgs n'+imgs.length+'">'+imgs.map(u=>'<img src="'+u+'" loading="lazy">').join('')+'</div>':'')
    +'<div class="mact"><button class="mbtn'+(likes.includes('her')?' liked':'')+'" data-like>'+(likes.includes('her')?'❤ 已赞':'♡ 赞')+'</button>'
    +'<button class="mbtn" data-cmt>评论</button><span class="mlikes">'+likeTxt+'</span></div>'
    +(m.comments&&m.comments.length?'<div class="cmts">'+m.comments.map(c=>'<div class="cmt'+(c.author==='him'?' him':'')+'"><b>'+(c.author==='him'?'小克':'嘉嘉')+':</b> '+esc(c.content)+'</div>').join('')+'</div>':'')
    +'<div class="cmtrow hide"><input placeholder="评论…" maxlength="500"><button class="pill" data-send>发</button></div>';
  el.querySelectorAll('.mimgs img').forEach(img=>img.onclick=()=>{
    document.getElementById('viewerImg').src=img.src;
    document.getElementById('viewer').classList.add('show');
  });
  el.querySelector('[data-like]').onclick=async()=>{
    const r=await fetch('/api/moments/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:m.id})});
    if(r.ok){const d=await r.json();m.likes=d.likes;render()}
  };
  const row=el.querySelector('.cmtrow');
  el.querySelector('[data-cmt]').onclick=()=>{row.classList.toggle('hide');if(!row.classList.contains('hide'))row.querySelector('input').focus()};
  const doSend=async()=>{
    const inp=row.querySelector('input'),v=inp.value.trim();
    if(!v)return;
    inp.value='';
    const r=await fetch('/api/moments/comment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:m.id,content:v})});
    if(r.ok){const d=await r.json();m.comments=(m.comments||[]).concat([d.comment]);render()}
  };
  row.querySelector('[data-send]').onclick=doSend;
  row.querySelector('input').onkeydown=e=>{if(e.key==='Enter')doSend()};
  return el;
}

// ═══ 发布 ═══
let pendImgs=[];
document.getElementById('pimg').onchange=async e=>{
  for(const f of[...e.target.files].slice(0,3-pendImgs.length)){
    const url=await compress(f);
    if(url)pendImgs.push(url);
  }
  e.target.value='';renderPend();
};
function renderPend(){
  const host=document.getElementById('pimgs');host.innerHTML='';
  pendImgs.forEach((u,i)=>{
    const d=document.createElement('div');d.className='ci';
    d.innerHTML='<img src="'+u+'"><button>✕</button>';
    d.querySelector('button').onclick=()=>{pendImgs.splice(i,1);renderPend()};
    host.appendChild(d);
  });
}
function compress(file){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const M=1280,r=Math.min(1,M/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.78));
    };
    img.onerror=()=>res(null);
    img.src=URL.createObjectURL(file);
  });
}
async function post(){
  const t=document.getElementById('ptext'),content=t.value.trim();
  if(!content&&!pendImgs.length)return;
  const btn=document.getElementById('postBtn');btn.disabled=true;
  const r=await fetch('/api/moments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,images:pendImgs})});
  btn.disabled=false;
  if(r.ok){
    const d=await r.json();
    moments.unshift(d.moment);
    t.value='';pendImgs=[];renderPend();render();
    localStorage.setItem('bunny_moments_seen',String(d.moment.id));
  }
}

load(true);
setInterval(()=>{ // 他的点赞/评论会晚一点到 —— 页面开着就悄悄刷新
  if(document.visibilityState==='visible')load(true);
},60e3);
</script>
</body>
</html>
