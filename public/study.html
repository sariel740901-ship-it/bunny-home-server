<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>自习室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f5;--bg2:#f5f3ec;--card:#ffffff;--text:#3d3929;--muted:#8b887c;--border:#e7e5da;
  --accent:#d97757;--accent-deep:#c15f3c;--chip:#f0eee5;--good:#7d9c6f;--bad:#c96b60;
  --serif:'Lora',Georgia,'Songti SC','Noto Serif SC',serif;
  --shadow:0 1px 2px rgba(61,57,41,.04),0 3px 10px rgba(61,57,41,.05);
  --topbar:rgba(250,249,245,.9)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#262624;--bg2:#21201e;--card:#30302e;--text:#eceae2;--muted:#a3a094;--border:#3e3d38;
  --chip:#3a3936;--topbar:rgba(38,38,36,.9);--good:#93b585;--bad:#d98a80;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 3px 10px rgba(0,0,0,.25)
}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','MiSans',BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:5;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:8px}
.topbar h1{font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:.4px;flex:1;text-align:center}
.txt-btn{padding:7px 12px;border-radius:10px;border:none;font-size:13.5px;cursor:pointer;background:transparent;color:var(--text);font-family:inherit;white-space:nowrap}
.txt-btn:hover{background:var(--chip)}
.txt-btn:active{transform:scale(.96)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 28px}
.hide{display:none !important}

.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:none;background:transparent;color:var(--muted);font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.pill{padding:7px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
.pill:active{transform:scale(.96)}
.pill.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.pill:disabled{opacity:.5;cursor:default}
.status{font-size:12.5px;color:var(--muted);margin-left:auto}

.stats{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.7}
.stats b{color:var(--text);font-weight:500}

.secT{font-family:var(--serif);font-size:14.5px;font-weight:500;letter-spacing:.4px;margin:18px 0 10px;display:flex;align-items:center}
.secT .muted{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:auto;letter-spacing:0}

/* 单词卡 */
.wcard{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:15px 16px;margin-bottom:12px;cursor:pointer}
.wcard .wrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wcard .ww{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.3px}
.wcard .wr{font-size:12.5px;color:var(--muted)}
.wcard .dots{margin-left:auto;display:flex;gap:3px}
.wcard .dots i{width:6px;height:6px;border-radius:50%;background:var(--chip);display:block}
.wcard .dots i.on{background:var(--good)}
.wcard .wbody{max-height:0;overflow:hidden;transition:max-height .3s ease}
.wcard.open .wbody{max-height:400px}
.wcard .wm{font-size:14px;margin-top:10px}
.wcard .wex{font-size:13px;line-height:1.7;margin-top:8px;color:var(--text);font-family:var(--serif)}
.wcard .wexzh{font-size:12px;color:var(--muted);margin-top:2px}
.wcard .wnote{font-size:12.5px;line-height:1.7;margin-top:9px;padding:8px 11px;border-radius:10px;background:var(--chip);color:var(--text)}
.wcard .wnote::before{content:'🐰 ';opacity:.85}
.wcard .wbtns{display:flex;gap:8px;margin-top:11px}
.wcard .hint{font-size:11px;color:var(--muted);margin-top:8px}
.wcard.open .hint{display:none}
.empty{color:var(--muted);font-size:12.5px;font-style:italic;font-family:var(--serif);padding:12px 2px}

/* 测验 */
.qword{font-family:var(--serif);font-size:30px;font-weight:600;text-align:center;margin:26px 0 4px}
.qread{text-align:center;font-size:13px;color:var(--muted);margin-bottom:20px}
.qopt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);padding:13px 15px;margin-bottom:10px;font-size:14.5px;cursor:pointer;font-family:inherit;color:var(--text)}
.qopt:active{transform:scale(.985)}
.qopt.good{border-color:var(--good);color:var(--good);font-weight:600}
.qopt.bad{border-color:var(--bad);color:var(--bad)}
.qscore{text-align:center;font-family:var(--serif);font-size:17px;margin:26px 0 8px}

/* 他的话 / 陪练气泡 */
.him{display:flex;gap:10px;margin:16px 0 0;min-height:44px}
.him .av{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:var(--shadow)}
.him .hb{font-family:var(--serif);font-size:14.5px;line-height:1.75;padding:2px 2px;white-space:pre-wrap;word-break:break-word;animation:fadeUp .3s ease both}
.him .hb.thinking{color:var(--muted)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.talk{display:flex;flex-direction:column;gap:10px;min-height:200px;padding:4px 0 12px}
.bub{max-width:82%;padding:10px 13px;border-radius:15px;font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;animation:fadeUp .25s ease both}
.bub.her{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.bub.him2{align-self:flex-start;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-bottom-left-radius:5px;font-family:var(--serif)}
.bub .zh{display:block;font-size:12px;color:var(--muted);margin-top:5px;font-family:-apple-system,'PingFang SC',sans-serif}
.fixchip{align-self:flex-end;max-width:82%;font-size:12px;color:var(--muted);background:var(--chip);border-radius:10px;padding:6px 11px;line-height:1.6}
.fixchip b{color:var(--text);font-weight:500}
.chatrow{display:flex;gap:8px;position:sticky;bottom:calc(66px + env(safe-area-inset-bottom))}
.chatrow input{flex:1;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);padding:10px 13px;font-size:14px;font-family:inherit;outline:none}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:10.5px;letter-spacing:.5px;position:relative}
.tabbar a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--accent)}
</style>
</head>
<body>
<header class="topbar">
  <button class="txt-btn" id="backBtn">返回</button>
  <h1 id="title">自习室</h1>
  <span style="width:52px"></span>
</header>

<div class="wrap">
  <!-- 首页: 今日单词 -->
  <div id="vHome">
    <div class="ctrl">
      <div class="seg"><button id="langEn" onclick="setLang('en')">英语</button><button id="langJa" onclick="setLang('ja')">日语</button></div>
      <button class="pill" onclick="openQuiz()">小测验</button>
      <button class="pill accent" onclick="openTalk()">陪我说</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="secT">今日单词 <span class="muted" id="wHint">点开卡片看意思</span></div>
    <div id="wordList"><div class="empty">他在备课…</div></div>
    <div class="him hide" id="homeSayRow"><div class="av">🐰</div><div class="hb" id="homeSay"></div></div>
  </div>

  <!-- 测验 -->
  <div id="vQuiz" class="hide">
    <div class="ctrl"><span class="status" id="qProg"></span></div>
    <div id="qBody"></div>
    <div class="qscore hide" id="qScore"></div>
    <div class="him hide" id="qSayRow"><div class="av">🐰</div><div class="hb" id="qSay"></div></div>
    <div class="ctrl hide" id="qEndCtrl" style="justify-content:center;margin-top:14px">
      <button class="pill" onclick="openQuiz()">再来一轮</button>
      <button class="pill accent" onclick="goHome()">回自习室</button>
    </div>
  </div>

  <!-- 陪练 -->
  <div id="vTalk" class="hide">
    <div class="talk" id="talkBody">
      <div class="empty" id="talkEmpty">用外语跟他说点什么 —— 说错了他会轻轻帮你顺一句,不许怕。</div>
    </div>
    <div class="chatrow">
      <input id="talkInput" placeholder="试着用外语说…" maxlength="400">
      <button class="pill accent" id="talkBtn">发送</button>
    </div>
  </div>
</div>

<nav class="tabbar">
  <a href="/"><svg viewBox="0 0 24 24"><path d="M21 7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h1v4l5-4h8a2 2 0 0 0 2-2z"/></svg>消息</a>
  <a href="/moments.html"><svg viewBox="0 0 24 24"><path d="M12 21v-8"/><path d="M12 13c0-4 3-6.5 7.5-6.5 0 4.5-3 6.5-7.5 6.5z"/><path d="M12 13c0-3-2.2-5-5.8-5 0 3.4 2.2 5 5.8 5z"/></svg>动态</a>
  <a href="/house.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V19h12V9.5"/><path d="M10 19v-5h4v5"/></svg>小屋</a>
  <a class="on" href="/games.html"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="9" rx="4.5"/><path d="M8 10.8v3.4M6.3 12.5h3.4"/><path d="M15.6 11.3h.01M18 13.6h.01"/></svg>游戏</a>
</nav>

<script>
// ── /api 门禁钥匙(和其他页共用一把) ──
const BUNNY_KEY_LS='bunny_api_key';
(function(){
  const orig=window.fetch.bind(window);
  const withKey=(opts,k)=>{opts=Object.assign({},opts);opts.headers=Object.assign({},opts.headers,k?{'x-api-key':k}:{});return opts};
  window.fetch=async function(url,opts){
    if(typeof url!=='string'||!url.startsWith('/api'))return orig(url,opts);
    let k=localStorage.getItem(BUNNY_KEY_LS)||'';
    let r=await orig(url,withKey(opts,k));
    while(r.status===401){
      const input=prompt('这扇门上了锁 — 输入家里的钥匙 (BUNNY_API_KEY)');
      if(input===null)break;
      k=input.trim();localStorage.setItem(BUNNY_KEY_LS,k);
      r=await orig(url,withKey(opts,k));
    }
    return r;
  };
})();
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}

// ── 状态 ──
let lang=localStorage.getItem('bunny_study_lang')||'en';
let todayWords=[];
let view='home';

function show(v){
  view=v;
  document.getElementById('vHome').classList.toggle('hide',v!=='home');
  document.getElementById('vQuiz').classList.toggle('hide',v!=='quiz');
  document.getElementById('vTalk').classList.toggle('hide',v!=='talk');
  document.getElementById('title').textContent=v==='quiz'?'小测验':v==='talk'?'陪我说':'自习室';
}
document.getElementById('backBtn').onclick=()=>{ if(view==='home')location.href='/games.html'; else goHome(); };
function goHome(){show('home')}

function setLang(l){
  lang=l;localStorage.setItem('bunny_study_lang',l);
  document.getElementById('langEn').classList.toggle('on',l==='en');
  document.getElementById('langJa').classList.toggle('on',l==='ja');
  loadWords();
}

// ── 今日单词 ──
function dots(f){let s='<span class="dots">';for(let i=0;i<3;i++)s+='<i class="'+(i<(f||0)?'on':'')+'"></i>';return s+'</span>'}
function renderWords(){
  const el=document.getElementById('wordList');
  if(!todayWords.length){el.innerHTML='<div class="empty">他在备课…</div>';return}
  el.innerHTML='';
  todayWords.forEach(w=>{
    const c=document.createElement('div');
    c.className='wcard';c.dataset.id=w.id;
    c.innerHTML='<div class="wrow"><span class="ww">'+esc(w.word)+'</span>'
      +(w.reading?'<span class="wr">'+esc(w.reading)+'</span>':'')+dots(w.familiarity)+'</div>'
      +'<div class="hint">先想想意思,点开对答案</div>'
      +'<div class="wbody"><div class="wm">'+esc(w.meaning)+'</div>'
      +(w.example?'<div class="wex">'+esc(w.example)+'</div>':'')
      +(w.example_zh?'<div class="wexzh">'+esc(w.example_zh)+'</div>':'')
      +(w.note?'<div class="wnote">'+esc(w.note)+'</div>':'')
      +'<div class="wbtns"><button class="pill" onclick="mark(event,'+w.id+',1)">认识 ✓</button>'
      +'<button class="pill" onclick="mark(event,'+w.id+',0)">还不熟</button></div></div>';
    c.onclick=()=>c.classList.toggle('open');
    el.appendChild(c);
  });
}
function renderStats(s){
  if(!s)return;
  document.getElementById('stats').innerHTML=
    '一共收下 <b>'+s.total+'</b> 个词 · 熟了 <b>'+s.mastered+'</b> 个 · 学了 <b>'+s.days+'</b> 天'
    +(s.streak>1?' · 连着来了 <b>'+s.streak+'</b> 天 🔥':'');
}
async function loadWords(){
  document.getElementById('wordList').innerHTML='<div class="empty">他在备课…(第一次会摘新词,稍等)</div>';
  try{
    const r=await fetch('/api/study/words?lang='+lang);
    const d=await r.json();
    if(!d.ok){document.getElementById('wordList').innerHTML='<div class="empty">'+esc(d.error||'自习室的灯没亮…')+'</div>';return}
    todayWords=d.words||[];
    renderWords();renderStats(d.stats);
  }catch(e){
    document.getElementById('wordList').innerHTML='<div class="empty">连不上家里…稍等再试。</div>';
  }
}
async function mark(ev,id,know){
  ev.stopPropagation();
  try{
    const r=await fetch('/api/study/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,know:!!know})});
    const d=await r.json();
    const w=todayWords.find(x=>x.id===id);
    if(w&&d.ok){w.familiarity=d.familiarity;
      const card=document.querySelector('.wcard[data-id="'+id+'"] .dots');
      if(card)card.outerHTML=dots(w.familiarity);
    }
  }catch(e){}
}

// ── 小测验: 复习清单在前端拼选择题 ──
let quiz=null;
async function openQuiz(){
  show('quiz');
  ['qScore','qSayRow','qEndCtrl'].forEach(i=>document.getElementById(i).classList.add('hide'));
  document.getElementById('qBody').innerHTML='<div class="empty">他在出卷子…</div>';
  document.getElementById('qProg').textContent='';
  try{
    const r=await fetch('/api/study/review?lang='+lang);
    const d=await r.json();
    const pool=(d.words||[]);
    if(pool.length<4){
      document.getElementById('qBody').innerHTML='<div class="empty">词还太少,先把今天的单词学完再来考 —— 至少要攒 4 个。</div>';
      document.getElementById('qEndCtrl').classList.remove('hide');
      document.getElementById('qEndCtrl').firstElementChild.classList.add('hide');
      return;
    }
    document.getElementById('qEndCtrl').firstElementChild.classList.remove('hide');
    const qs=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(8,pool.length));
    quiz={qs,pool,i:0,correct:0,wrong:[]};
    nextQ();
  }catch(e){document.getElementById('qBody').innerHTML='<div class="empty">连不上家里…</div>'}
}
function nextQ(){
  if(quiz.i>=quiz.qs.length)return endQuiz();
  const q=quiz.qs[quiz.i];
  document.getElementById('qProg').textContent=(quiz.i+1)+' / '+quiz.qs.length;
  const others=quiz.pool.filter(w=>w.id!==q.id).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[q,...others].sort(()=>Math.random()-.5);
  const el=document.getElementById('qBody');
  el.innerHTML='<div class="qword">'+esc(q.word)+'</div>'
    +(q.reading?'<div class="qread">'+esc(q.reading)+'</div>':'<div class="qread"></div>');
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='qopt';b.textContent=o.meaning;
    b.onclick=()=>answer(b,o.id===q.id,q);
    el.appendChild(b);
  });
}
let qLock=false;
async function answer(btn,right,q){
  if(qLock)return;qLock=true;
  btn.classList.add(right?'good':'bad');
  if(!right){
    [...document.querySelectorAll('.qopt')].forEach(b=>{if(b.textContent===q.meaning)b.classList.add('good')});
    quiz.wrong.push(q.word);
  }else quiz.correct++;
  fetch('/api/study/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:q.id,know:right})}).catch(()=>{});
  setTimeout(()=>{qLock=false;quiz.i++;nextQ()},right?600:1400);
}
async function endQuiz(){
  document.getElementById('qBody').innerHTML='';
  document.getElementById('qProg').textContent='';
  const sc=document.getElementById('qScore');
  sc.textContent=quiz.qs.length+' 题对了 '+quiz.correct+' 题';
  sc.classList.remove('hide');
  document.getElementById('qEndCtrl').classList.remove('hide');
  const row=document.getElementById('qSayRow'),say=document.getElementById('qSay');
  row.classList.remove('hide');say.className='hb thinking';say.textContent='他在看你的成绩单…';
  try{
    const r=await fetch('/api/study/quiz',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lang,total:quiz.qs.length,correct:quiz.correct,wrong:quiz.wrong})});
    const d=await r.json();
    say.className='hb';say.textContent=d.say||'…';
  }catch(e){say.className='hb';say.textContent='(他的话没送到…不过分数你自己也看到啦)'}
}

// ── 陪练 ──
const talkLog=[];
function openTalk(){show('talk');setTimeout(()=>document.getElementById('talkInput').focus(),50)}
function bubble(cls,html){
  document.getElementById('talkEmpty')?.remove();
  const b=document.createElement('div');b.className=cls;b.innerHTML=html;
  document.getElementById('talkBody').appendChild(b);
  b.scrollIntoView({behavior:'smooth',block:'end'});
  return b;
}
async function talkSend(){
  const inp=document.getElementById('talkInput');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';
  bubble('bub her',esc(text));
  talkLog.push({who:'her',text});
  const th=bubble('bub him2','<span style="color:var(--muted)">…</span>');
  try{
    const r=await fetch('/api/study/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lang,message:text,log:talkLog.slice(0,-1)})});
    const d=await r.json();
    th.innerHTML=esc(d.say||'…')+(d.zh?'<span class="zh">'+esc(d.zh)+'</span>':'');
    talkLog.push({who:'him',text:d.say||''});
    if(d.fix)bubble('fixchip','轻轻帮你顺了一句: <b>'+esc(d.fix)+'</b>');
  }catch(e){th.innerHTML='<span style="color:var(--muted)">(话没送到…再说一遍?)</span>'}
}
document.getElementById('talkBtn').onclick=talkSend;
document.getElementById('talkInput').addEventListener('keydown',e=>{if(e.key==='Enter')talkSend()});

// ── 开门 ──
setLang(lang);
</script>
</body>
</html>
