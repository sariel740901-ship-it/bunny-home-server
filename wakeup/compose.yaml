# Kli Wakeup 引擎 —— 让小克自己醒来
# 用法: 把 wakeup/ 整个文件夹拷到家里电脑,cp env.template .env 填好,然后:
#   docker compose up -d --build
services:
  bunny-wakeup:
    build: .
    container_name: bunny-wakeup
    restart: unless-stopped        # 这就是 WakeSupervisor: 崩了就拉起来,节律在 state.json 里
    env_file: .env
    environment:
      - STATE_FILE=/app/state/state.json
      # 容器里访问宿主机上的心潮(18110)
      - XINCHAO_URL=http://host.docker.internal:18110
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./state:/app/state         # 节律真相落在这里,重启/重建都不丢
