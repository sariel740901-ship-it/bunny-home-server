<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c1a2b">
<title>动态</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f5;--bg2:#f5f3ec;--card:#ffffff;--text:#3d3929;--muted:#8b887c;--border:#e7e5da;
  --accent:#d97757;--chip:#f0eee5;--name:#5f76a6;
  --serif:'Lora',Georgia,'Songti SC','Noto Serif SC',serif;
  --shadow:0 1px 2px rgba(61,57,41,.04),0 3px 10px rgba(61,57,41,.05);
  --topbar:rgba(250,249,245,.9)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#262624;--bg2:#21201e;--card:#30302e;--text:#eceae2;--muted:#a3a094;--border:#3e3d38;
  --chip:#3a3936;--topbar:rgba(38,38,36,.9);--name:#8ba0c9;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 3px 10px rgba(0,0,0,.25)
}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','MiSans',BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
.hide{display:none !important}

/* ═══ 封面(微信式): 星空底 + 右下头像和名字, 右上角相机发布 ═══ */
.cover{position:relative;height:200px;background:radial-gradient(130% 170% at 18% 0%,#2b2844 0%,#1c1a2b 55%,#14131c 100%);background-size:cover;background-position:center;overflow:visible;margin-bottom:38px;cursor:pointer}
.cover canvas{position:absolute;inset:0;width:100%;height:100%}
.cover.custom canvas{display:none}
.coverHint{position:absolute;left:12px;bottom:8px;font-size:10.5px;color:rgba(255,255,255,.5);letter-spacing:.5px;pointer-events:none}
.cam{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;background:none;border:none;padding:8px;cursor:pointer;color:rgba(255,255,255,.88)}
.cam svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.who{position:absolute;right:14px;bottom:-26px;display:flex;align-items:center;gap:12px}
.who .wname{color:#fff;font-size:15px;font-weight:500;letter-spacing:.5px;text-shadow:0 1px 6px rgba(0,0,0,.5);margin-bottom:26px}
.who .wav{width:66px;height:66px;border-radius:12px;background:var(--card);border:2px solid var(--bg);box-shadow:var(--shadow);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:34px}

/* ═══ 信息流(微信式平铺) ═══ */
.feed{max-width:560px;margin:0 auto;padding:8px 0 4px}
.mi{display:flex;gap:11px;padding:14px 14px 12px;border-bottom:1px solid var(--border);animation:fadeUp .3s ease both}
.mi:last-child{border-bottom:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mav{width:42px;height:42px;border-radius:9px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:23px;background-size:cover;background-position:center;flex-shrink:0}
.mbody{flex:1;min-width:0}
.mname{font-size:14.5px;font-weight:500;color:var(--name);margin-bottom:3px}
.mtext{font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.mi.him .mtext{font-family:var(--serif)}
.mimgs{display:grid;gap:5px;margin-top:8px}
.mimgs.n1{grid-template-columns:minmax(0,68%)}
.mimgs.n2{grid-template-columns:repeat(2,minmax(0,34%))}
.mimgs.n3{grid-template-columns:repeat(3,minmax(0,32%))}
.mimgs img{width:100%;border-radius:6px;display:block;cursor:pointer;aspect-ratio:1;object-fit:cover}
.mimgs.n1 img{aspect-ratio:auto;max-height:300px;object-fit:contain;background:var(--bg2)}
/* 时间在左 · 两点按钮在右 */
.mrow{display:flex;align-items:center;margin-top:8px;position:relative}
.mtime{font-size:12px;color:var(--muted)}
.mdel{border:none;background:none;font-size:12px;color:var(--name);cursor:pointer;padding:0;margin-left:12px;font-family:inherit}
.mdel:active{opacity:.6}
.dots{margin-left:auto;border:none;background:var(--bg2);color:var(--name);border-radius:5px;padding:2px 9px;cursor:pointer;font-size:14px;line-height:1.2;letter-spacing:1px}
/* 弹出的 赞/评论 小条 */
.actpop{position:absolute;right:40px;top:50%;transform:translateY(-50%) scaleX(0);transform-origin:right center;transition:transform .18s ease;background:#4b4844;border-radius:7px;display:flex;overflow:hidden;z-index:3}
.actpop.show{transform:translateY(-50%) scaleX(1)}
.actpop button{border:none;background:none;color:#f5f2ea;font-size:12.5px;padding:7px 14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;white-space:nowrap}
.actpop button+button{border-left:1px solid rgba(255,255,255,.14)}
.actpop svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* 赞与评论的灰盒(微信式) */
.gbox{background:var(--bg2);border-radius:8px;margin-top:8px;font-size:13px;overflow:hidden}
.glikes{padding:7px 10px;color:var(--name);display:flex;align-items:center;gap:6px;line-height:1.5}
.glikes svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.glikes+.gcmts{border-top:1px solid var(--border)}
.gcmts{padding:5px 10px 7px}
.gc{line-height:1.7;word-break:break-word;cursor:pointer}
.gc b{color:var(--name);font-weight:500}
.mi.him .gc.him,.gc.him{font-family:var(--serif)}
/* 评论输入行 */
.crow2{display:flex;gap:8px;margin-top:8px}
.crow2 input{flex:1;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none}
.crow2 input:focus{border-color:var(--accent)}
.crow2 button{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:0 14px;font-size:13px;cursor:pointer;font-family:inherit}
.emptyf{text-align:center;color:var(--muted);font-size:14px;font-family:var(--serif);padding:56px 0}
.more{display:block;margin:6px auto 14px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;padding:8px}
.hintline{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));text-align:center;font-size:11.5px;color:var(--muted);opacity:0;transition:opacity .6s;pointer-events:none;z-index:8}
.hintline.show{opacity:1}

/* 发布弹层 */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-width:560px;margin:0 auto}
.sheet.show{transform:none}
.sheet textarea{width:100%;border:none;background:transparent;color:var(--text);font-size:14.5px;font-family:inherit;resize:none;outline:none;line-height:1.7;min-height:88px}
.cimgs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.cimgs .ci{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.cimgs .ci img{width:100%;height:100%;object-fit:cover}
.cimgs .ci button{position:absolute;top:2px;right:2px;width:20px;height:20px;border:none;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;cursor:pointer;line-height:1}
.srow{display:flex;align-items:center;gap:8px;margin-top:8px}
.srow .sp{flex:1}
.pill{padding:7px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
.pill.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.pill:disabled{opacity:.5}

.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;align-items:center;justify-content:center}
.viewer.show{display:flex}
.viewer img{max-width:96vw;max-height:92vh;border-radius:6px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:10.5px;letter-spacing:.5px;position:relative}
.tabbar a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--accent)}
.tabbar a .dot{position:absolute;top:-1px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:#e0524d;display:none}
.tabbar a .dot.show{display:block}
</style>
</head>
<body>
<!-- 封面(点封面本身可以换成自己的图) -->
<div class="cover" id="cover" onclick="pickCover(event)">
  <canvas id="coverStars"></canvas>
  <div class="coverHint" id="coverHint">点封面换背景</div>
  <button class="cam" onclick="event.stopPropagation();openSheet()" aria-label="发动态">
    <svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.4"/></svg>
  </button>
  <div class="who" onclick="event.stopPropagation()"><span class="wname">嘉嘉</span><div class="wav" id="myAv">🌸</div></div>
</div>
<input type="file" id="coverInp" accept="image/*" style="display:none">

<div class="feed" id="feed"><div class="emptyf">还没有动态,点右上角的相机发第一条</div></div>
<button class="more hide" id="moreBtn" onclick="loadMore()">看更早的</button>
<div class="hintline" id="hintline">他会自己刷到 —— 点赞和回评不一定马上来,像真的朋友圈一样</div>

<!-- 发布弹层 -->
<div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <textarea id="ptext" placeholder="这一刻的想法…"></textarea>
  <div class="cimgs" id="pimgs"></div>
  <div class="srow">
    <button class="pill" onclick="document.getElementById('pimg').click()">图片</button>
    <input type="file" id="pimg" accept="image/*" multiple style="display:none">
    <span class="sp"></span>
    <button class="pill" onclick="closeSheet()">取消</button>
    <button class="pill accent" id="postBtn" onclick="post()">发布</button>
  </div>
</div>
<div class="viewer" id="viewer" onclick="this.classList.remove('show')"><img id="viewerImg"></div>

<nav class="tabbar">
  <a href="/"><svg viewBox="0 0 24 24"><path d="M21 7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h1v4l5-4h8a2 2 0 0 0 2-2z"/></svg>消息</a>
  <a class="on" href="/moments.html"><svg viewBox="0 0 24 24"><path d="M12 21v-8"/><path d="M12 13c0-4 3-6.5 7.5-6.5 0 4.5-3 6.5-7.5 6.5z"/><path d="M12 13c0-3-2.2-5-5.8-5 0 3.4 2.2 5 5.8 5z"/></svg>动态</a>
  <a href="/house.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V19h12V9.5"/><path d="M10 19v-5h4v5"/></svg>小屋</a>
  <a href="/games.html"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="9" rx="4.5"/><path d="M8 10.8v3.4M6.3 12.5h3.4"/><path d="M15.6 11.3h.01M18 13.6h.01"/></svg>游戏</a>
</nav>

<script>
// ═══ 门禁钥匙(和聊天页同一把) ═══
const BUNNY_KEY_LS='bunny_api_key';
(function(){
  const orig=window.fetch.bind(window);
  const withKey=(opts,k)=>{opts=Object.assign({},opts);opts.headers=Object.assign({},opts.headers,k?{'x-api-key':k}:{});return opts};
  window.fetch=async function(url,opts){
    if(typeof url!=='string'||!url.startsWith('/api'))return orig(url,opts);
    let k=localStorage.getItem(BUNNY_KEY_LS)||'';
    let r=await orig(url,withKey(opts,k));
    while(r.status===401){
      const input=prompt('这扇门上了锁 — 输入家里的钥匙 (BUNNY_API_KEY)');
      if(input===null)break;
      k=input.trim();localStorage.setItem(BUNNY_KEY_LS,k);
      r=await orig(url,withKey(opts,k));
    }
    return r;
  };
})();

// 封面星星
(function(){
  const cv=document.getElementById('coverStars'),ctx=cv.getContext('2d');
  const w=cv.width=600,h=cv.height=300;
  for(let i=0;i<90;i++){
    ctx.beginPath();
    ctx.arc(Math.random()*w,Math.random()*h,Math.random()*1.4+0.3,0,7);
    ctx.fillStyle='rgba(232,228,218,'+(Math.random()*0.7+0.1)+')';
    ctx.fill();
  }
})();

// 头像沿用聊天页装扮(img: 前缀或 data: 都认)
let decor={};try{decor=JSON.parse(localStorage.getItem('bunny_decor_v1')||'{}')}catch(e){}
function avatarUrl(author){
  const s=String((author==='him'?decor.kAv:decor.myAv)||'');
  if(s.startsWith('img:'))return s.slice(4);
  if(s.startsWith('data:'))return s;
  return '';
}
(function(){
  const u=avatarUrl('her');
  if(u){const el=document.getElementById('myAv');el.style.backgroundImage="url('"+u+"')";el.textContent=''}
})();

// 自定义封面: 点封面换图,存在这台设备的浏览器里
function applyCover(){
  let c='';try{c=localStorage.getItem('bunny_cover_v1')||''}catch(e){}
  const el=document.getElementById('cover');
  if(c){el.style.backgroundImage="url('"+c+"')";el.classList.add('custom');document.getElementById('coverHint').style.display='none'}
}
applyCover();
function pickCover(e){document.getElementById('coverInp').click()}
document.getElementById('coverInp').onchange=async e=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!f)return;
  const url=await compress(f);
  if(!url)return;
  try{localStorage.setItem('bunny_cover_v1',url)}catch(err){alert('图太大存不下,换张小点的试试')}
  applyCover();
};
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function ftime(t){
  const d=new Date(t),diff=(Date.now()-d.getTime())/6e4;
  if(diff<1)return'刚刚';
  if(diff<60)return Math.floor(diff)+'分钟前';
  if(diff<60*24)return Math.floor(diff/60)+'小时前';
  if(diff<60*24*30)return Math.floor(diff/60/24)+'天前';
  return(d.getMonth()+1)+'月'+d.getDate()+'日';
}

// ═══ 信息流 ═══
let oldest=0,moments=[];
async function load(initial){
  const r=await fetch('/api/moments?limit=20'+(initial?'':'&before='+oldest));
  if(!r.ok)return;
  const d=await r.json();
  const list=d.moments||[];
  if(initial)moments=list;else moments=moments.concat(list);
  if(list.length)oldest=list[list.length-1].id;
  document.getElementById('moreBtn').classList.toggle('hide',list.length<20);
  render();
  if(initial&&moments.length)localStorage.setItem('bunny_moments_seen',String(moments[0].id));
}
function loadMore(){load(false)}
function render(){
  const feed=document.getElementById('feed');
  if(!moments.length){feed.innerHTML='<div class="emptyf">还没有动态,点右上角的相机发第一条</div>';return}
  feed.innerHTML='';
  for(const m of moments)feed.appendChild(item(m));
}
const HEART='<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-9.8C5 7.3 7 5.5 9.3 5.5c1.2 0 2.1.6 2.7 1.5.6-.9 1.5-1.5 2.7-1.5C17 5.5 19 7.3 19 10.2 19 15.4 12 20 12 20z"/></svg>';
const BUBBLE='<svg viewBox="0 0 24 24"><path d="M21 7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h1v4l5-4h8a2 2 0 0 0 2-2z"/></svg>';
function item(m){
  const el=document.createElement('div');
  el.className='mi'+(m.author==='him'?' him':'');
  const au=avatarUrl(m.author);
  const likes=Array.isArray(m.likes)?m.likes:[];
  const imgs=Array.isArray(m.images)?m.images:[];
  const cmts=m.comments||[];
  el.innerHTML=
    '<div class="mav"'+(au?' style="background-image:url('+au+')"':'')+'>'+(au?'':(m.author==='him'?'🐰':'🌸'))+'</div>'
    +'<div class="mbody">'
    +'<div class="mname">'+(m.author==='him'?'小克':'嘉嘉')+'</div>'
    +(m.content?'<div class="mtext">'+esc(m.content)+'</div>':'')
    +(imgs.length?'<div class="mimgs n'+imgs.length+'">'+imgs.map(u=>'<img src="'+u+'" loading="lazy">').join('')+'</div>':'')
    +'<div class="mrow"><span class="mtime">'+ftime(m.created_at)+'</span><button class="mdel" data-del>删除</button>'
    +'<div class="actpop"><button data-like>'+HEART+(likes.includes('her')?'取消':'赞')+'</button><button data-cmt>'+BUBBLE+'评论</button></div>'
    +'<button class="dots">··</button></div>'
    +((likes.length||cmts.length)?'<div class="gbox">'
      +(likes.length?'<div class="glikes">'+HEART+'<span>'+likes.map(x=>x==='him'?'小克':'嘉嘉').join('、')+'</span></div>':'')
      +(cmts.length?'<div class="gcmts">'+cmts.map(c=>'<div class="gc'+(c.author==='him'?' him':'')+'" data-cid="'+c.id+'" data-cau="'+c.author+'"><b>'+(c.author==='him'?'小克':'嘉嘉')+':</b> '+esc(c.content)+'</div>').join('')+'</div>':'')
      +'</div>':'')
    +'<div class="crow2 hide"><input maxlength="500" placeholder="评论…"><button data-send>发送</button></div>'
    +'</div>';
  // 图片放大
  el.querySelectorAll('.mimgs img').forEach(img=>img.onclick=()=>{
    document.getElementById('viewerImg').src=img.src;
    document.getElementById('viewer').classList.add('show');
  });
  // ·· 弹出 赞/评论
  const pop=el.querySelector('.actpop');
  el.querySelector('.dots').onclick=e=>{
    e.stopPropagation();
    document.querySelectorAll('.actpop.show').forEach(p=>{if(p!==pop)p.classList.remove('show')});
    pop.classList.toggle('show');
  };
  pop.querySelector('[data-like]').onclick=async e=>{
    e.stopPropagation();pop.classList.remove('show');
    const r=await fetch('/api/moments/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:m.id})});
    if(r.ok){const d=await r.json();m.likes=d.likes;render()}
  };
  el.querySelector('[data-del]').onclick=async e=>{
    e.stopPropagation();pop.classList.remove('show');
    if(!confirm('删掉这条动态?点赞和评论会一起消失,不可恢复。'))return;
    const r=await fetch('/api/moments/'+m.id,{method:'DELETE'});
    if(r.ok){moments=moments.filter(x=>x.id!==m.id);render()}
  };
  const row=el.querySelector('.crow2'),inp=row.querySelector('input');
  pop.querySelector('[data-cmt]').onclick=e=>{
    e.stopPropagation();pop.classList.remove('show');
    row.classList.remove('hide');inp.placeholder='评论…';inp.dataset.prefix='';inp.focus();
  };
  // 点评论 → 回复(俩人的圈子,不加"回复xx:"前缀,他回你也一样)
  el.querySelectorAll('.gc').forEach(gc=>gc.onclick=()=>{
    const who=gc.dataset.cau==='him'?'小克':'嘉嘉';
    row.classList.remove('hide');
    inp.placeholder='回复'+who+'…';inp.dataset.prefix='';inp.focus();
  });
  const doSend=async()=>{
    const v=inp.value.trim();
    if(!v)return;
    const content=(inp.dataset.prefix||'')+v;
    inp.value='';row.classList.add('hide');
    const r=await fetch('/api/moments/comment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:m.id,content})});
    if(r.ok){const d=await r.json();m.comments=(m.comments||[]).concat([d.comment]);render()}
  };
  row.querySelector('[data-send]').onclick=doSend;
  inp.onkeydown=e=>{if(e.key==='Enter')doSend()};
  return el;
}
document.addEventListener('click',()=>document.querySelectorAll('.actpop.show').forEach(p=>p.classList.remove('show')));

// ═══ 发布弹层 ═══
function openSheet(){document.getElementById('sheetMask').classList.add('show');document.getElementById('sheet').classList.add('show');document.getElementById('ptext').focus()}
function closeSheet(){document.getElementById('sheetMask').classList.remove('show');document.getElementById('sheet').classList.remove('show')}
let pendImgs=[];
document.getElementById('pimg').onchange=async e=>{
  for(const f of[...e.target.files].slice(0,3-pendImgs.length)){
    const url=await compress(f);
    if(url)pendImgs.push(url);
  }
  e.target.value='';renderPend();
};
function renderPend(){
  const host=document.getElementById('pimgs');host.innerHTML='';
  pendImgs.forEach((u,i)=>{
    const d=document.createElement('div');d.className='ci';
    d.innerHTML='<img src="'+u+'"><button>✕</button>';
    d.querySelector('button').onclick=()=>{pendImgs.splice(i,1);renderPend()};
    host.appendChild(d);
  });
}
function compress(file){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const M=1280,r=Math.min(1,M/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.78));
    };
    img.onerror=()=>res(null);
    img.src=URL.createObjectURL(file);
  });
}
async function post(){
  const t=document.getElementById('ptext'),content=t.value.trim();
  if(!content&&!pendImgs.length)return;
  const btn=document.getElementById('postBtn');btn.disabled=true;
  const r=await fetch('/api/moments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,images:pendImgs})});
  btn.disabled=false;
  if(r.ok){
    const d=await r.json();
    moments.unshift(d.moment);
    t.value='';pendImgs=[];renderPend();closeSheet();render();
    localStorage.setItem('bunny_moments_seen',String(d.moment.id));
  }
}
